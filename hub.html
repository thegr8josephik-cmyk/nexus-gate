<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Astral Hub</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Astral Hub">
  <meta name="theme-color" content="#000000">
  <style>
    :root{
      --bg:#000;--panel:#0e0e14;--panel-h:#16161f;--border:#2a2a38;
      --text:#e8e8ef;--muted:#9a9ab0;
      --blue:#6366f1;--purple:#a855f7;--grey:#c7c7d6;
      --grad:linear-gradient(135deg,#6366f1,#a855f7);
      --glow:rgba(99,102,241,.28);--glow2:rgba(168,85,247,.28);
      --mono:'Cascadia Mono','Cascadia Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Georgia,'Times New Roman',serif;
      background:var(--bg);color:var(--text);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100dvh;text-align:center;
      padding:max(env(safe-area-inset-top),20px) 20px max(env(safe-area-inset-bottom),20px);
    }
    .close-sigil{position:fixed;top:max(env(safe-area-inset-top),12px);right:16px;z-index:200;width:42px;height:42px;background:var(--panel);border:2px solid var(--border);box-shadow:3px 3px 0 #14141c;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--grey);font-size:1.1rem;font-family:var(--mono);transition:transform .1s,box-shadow .1s,border-color .15s}
    .close-sigil:active{transform:translate(3px,3px);box-shadow:0 0 0}
    .close-sigil:hover{border-color:#ef4444;color:#ef4444}
    .mark{font-family:var(--mono);font-size:.9rem;font-weight:700;letter-spacing:6px;color:var(--purple);margin-bottom:14px}
    h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;line-height:1.05;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:var(--mono)}
    .sub{color:var(--muted);margin-bottom:32px;font-size:1rem;font-style:italic;max-width:440px;line-height:1.6}
    .search-box{display:flex;gap:10px;background:var(--panel);padding:10px;border:2px solid var(--border);box-shadow:5px 5px 0 #14141c;width:100%;max-width:500px}
    .search-box input{flex:1;background:#000;border:2px solid var(--border);color:var(--text);font-size:.95rem;outline:none;padding:12px 14px;font-family:var(--mono);min-width:0}
    .search-box input:focus{border-color:var(--blue)}
    .search-box input::placeholder{color:var(--muted)}
    .seek-btn{background:var(--grad);border:2px solid var(--purple);box-shadow:3px 3px 0 var(--glow2);color:#fff;padding:0 24px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:1px;transition:transform .1s,box-shadow .1s}
    .seek-btn:active{transform:translate(3px,3px);box-shadow:0 0 0}
    .quick-links{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .quick-links a{color:var(--muted);text-decoration:none;padding:10px 18px;border:2px solid var(--border);background:var(--panel);box-shadow:3px 3px 0 #14141c;font-size:.85rem;font-weight:700;font-family:var(--mono);letter-spacing:1px;transition:transform .1s,box-shadow .1s,border-color .15s,color .15s,background .15s}
    .quick-links a:hover{border-color:var(--blue);color:var(--text);background:var(--panel-h);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--glow)}
    .quick-links a:active{transform:translate(2px,2px);box-shadow:0 0 0}
    .foot{position:fixed;bottom:max(env(safe-area-inset-bottom),14px);left:0;right:0;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:1px}
  </style>
</head>
<body>
  <a href="./index.html" class="close-sigil" title="Return to Nexus Gate">✕</a>
  <div class="mark">道 · 門</div>
  <h1>The Astral Hub</h1>
  <p class="sub">Your personal gateway to the multiverse.</p>
  <form class="search-box" onsubmit="event.preventDefault(); window.open('https://www.google.com/search?q=' + encodeURIComponent(this.query.value), '_blank');">
    <input type="text" name="query" placeholder="Search the Astral Web..." required autocomplete="off">
    <button type="submit" class="seek-btn">SEEK</button>
  </form>
  <div class="quick-links">
    <a href="https://en.wikipedia.org" target="_blank" rel="noopener noreferrer">WIKIPEDIA</a>
    <a href="https://archive.org" target="_blank" rel="noopener noreferrer">INTERNET ARCHIVE</a>
    <a href="https://github.com" target="_blank" rel="noopener noreferrer">GITHUB</a>
  </div>
  <div class="foot">Astral Hub · Nexus Gate</div>
</body>
</html>
