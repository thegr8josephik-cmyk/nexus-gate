<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EPUB Reader</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EPUB Reader" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root {
      --bg: #05070f;
      --panel: rgba(18, 24, 48, 0.72);
      --border: rgba(120, 190, 255, 0.22);
      --text: #eaf3ff;
      --muted: #93a7c9;
      --accent: #66e0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: max(env(safe-area-inset-top), 12px) 14px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
    }

    .file-button, .tool-button {
      display: inline-block;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(102, 224, 255, 0.35);
      background: rgba(102, 224, 255, 0.12);
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .tool-button {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    input[type="file"] { display: none; }

    #status {
      flex: 1;
      min-width: 140px;
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #stage {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: var(--bg);
    }

    #viewer {
      width: 100%;
      height: 100%;
      transition: opacity 0.2s ease-in-out;
      opacity: 1; 
    }

    #viewer iframe { border: 0; background: transparent; }

    .controls {
      display: flex;
      gap: 10px;
      padding: 12px 14px max(env(safe-area-inset-bottom), 14px);
      background: var(--panel);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .controls button {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .controls button:active { transform: scale(0.98); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="toolbar">
    <label class="file-button" for="file">Open EPUB</label>
    <input id="file" type="file" accept=".epub,application/epub+zip" />
    <button id="spreadButton" class="tool-button" type="button">Spread: Double</button>
    <div id="status">No book loaded</div>
  </div>

  <div id="stage">
    <div id="viewer"></div>
  </div>

  <div class="controls">
    <button id="prev" type="button">← Prev</button>
    <button id="next" type="button">Next →</button>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <script>
    const fileInput = document.getElementById("file");
    const status = document.getElementById("status");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const spreadButton = document.getElementById("spreadButton");
    const viewer = document.getElementById("viewer");

    let currentBuffer = null;
    let currentFileName = "";
    let book = null;
    let rendition = null;
    let animating = false;

    let spreadMode = localStorage.getItem("epub-spread-mode") || "double";

    function updateSpreadButton() {
      spreadButton.textContent = spreadMode === "double" ? "Spread: Double" : "Spread: Single";
    }
    updateSpreadButton();

    async function initReader() {
      if (!currentBuffer) return;
      status.textContent = "Opening...";

      try {
        let lastLocation = null;
        if (rendition) {
          try { lastLocation = await Promise.resolve(rendition.currentLocation()); } catch (e) {}
          try { rendition.destroy(); } catch (e) {}
          rendition = null;
        }
        if (book) { try { book.destroy(); } catch (e) {} book = null; }

        book = ePub(currentBuffer.slice(0));

        rendition = book.renderTo("viewer", {
          width: "100%",
          height: "100%",
          flow: "paginated",
          spread: spreadMode === "double" ? "always" : "none",
          minSpreadWidth: 0
        });

        // THE SCHOLAR'S THEME: Georgia Font + Dark Mode
        rendition.themes.register("dark-serif", {
          "body": {
            "background": "#05070f !important",
            "color": "#e5edff !important",
            "font-family": "Georgia, 'Times New Roman', serif !important",
            "line-height": "1.6 !important",
            "padding": "20px !important"
          },
          "p, div, span, li, h1, h2, h3, h4, h5, h6": {
            "color": "#e5edff !important",
            "font-family": "Georgia, 'Times New Roman', serif !important"
          },
          "a": { "color": "#66e0ff !important" }
        });

        rendition.themes.select("dark-serif");

        // Listen for render to fade IN
        rendition.on('rendered', () => {
            viewer.style.opacity = '1';
            animating = false;
        });

        // THE MEMORY CRYSTAL (Autosave)
        rendition.on('relocated', (locations) => {
            if (locations && locations.start && locations.start.cfi) {
                localStorage.setItem(`epub-progress-${currentFileName}`, locations.start.cfi);
            }
        });

        // Determine where to start reading (Autosave retrieval)
        const lastLocationCfi = lastLocation && lastLocation.start && lastLocation.start.cfi ? lastLocation.start.cfi : undefined;
        const savedProgress = localStorage.getItem(`epub-progress-${currentFileName}`);
        const startLocation = lastLocationCfi || savedProgress;

        await rendition.display(startLocation);
        status.textContent = currentFileName || "Loaded";
      } catch (error) {
        console.error(error);
        status.textContent = "Could not open EPUB.";
      }
    }

    fileInput.addEventListener("change", async function () {
      const file = fileInput.files[0];
      if (!file) return;
      currentFileName = file.name;
      currentBuffer = await file.arrayBuffer();
      await initReader();
    });

    spreadButton.addEventListener("click", async function () {
      spreadMode = spreadMode === "double" ? "single" : "double";
      localStorage.setItem("epub-spread-mode", spreadMode);
      updateSpreadButton();
      await initReader();
    });

    // The "Scholar's Fade" Logic
    async function turn(direction) {
      if (!rendition || animating) return;
      animating = true;

      viewer.style.opacity = '0';
      await new Promise(r => setTimeout(r, 200));

      if (direction === "next") await rendition.next();
      else await rendition.prev();
    }

    prevButton.addEventListener("click", () => turn("prev"));
    nextButton.addEventListener("click", () => turn("next"));

    document.addEventListener("keydown", function (event) {
      if (!rendition || animating) return;
      if (event.key === "ArrowLeft") turn("prev");
      if (event.key === "ArrowRight") turn("next");
    });

    let pointerDown = false, startX = 0, startY = 0, lastX = 0, lastY = 0, horizontalSwipe = null;

    viewer.addEventListener("pointerdown", function (event) {
      if (animating) return;
      pointerDown = true;
      startX = lastX = event.clientX;
      startY = lastY = event.clientY;
      horizontalSwipe = null;
    });

    window.addEventListener("pointermove", function (event) {
      if (!pointerDown || animating) return;
      lastX = event.clientX;
      lastY = event.clientY;
      const dx = lastX - startX, dy = lastY - startY;
      if (horizontalSwipe === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        horizontalSwipe = Math.abs(dx) > Math.abs(dy);
      }
    });

    window.addEventListener("pointerup", async function () {
      if (!pointerDown) return;
      pointerDown = false;
      const dx = lastX - startX;
      const dy = lastY - startY;
      if (horizontalSwipe && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
        const direction = dx < 0 ? "next" : "prev";
        await turn(direction);
      }
      horizontalSwipe = null;
    });

    window.addEventListener("resize", function () { if (rendition) rendition.resize(); });
  </script>
</body>
</html>
