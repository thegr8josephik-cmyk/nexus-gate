<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dao Matrix | Nexus Gate</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <style>
    :root {
      --bg: #090a0f;
      --panel: rgba(255,255,255,0.04);
      --panel-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.4);
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --gold: #fbbf24;
      --orthodox: #3b82f6;
      --demonic: #ef4444;
      --chaotic: #f59e0b;
      --body: #22c55e;
      --spirit: #a855f7;
      --void: #6b7280;
      --sovereign: #f59e0b;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia","Merriweather",serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HAMBURGER */
    .hamburger {
      position: fixed;
      top: max(env(safe-area-inset-top),12px);
      left: 16px;
      z-index: 200;
      width: 40px; height: 40px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 1.3rem;
    }
    .close-sigil {
      position: fixed;
      top: max(env(safe-area-inset-top),12px);
      right: 16px;
      z-index: 200;
      width: 40px; height: 40px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      color: var(--text-dim);
      font-size: 1.1rem;
    }

    /* DRAWER */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0; left: -280px;
      width: 280px; height: 100%;
      background: #0d0f14;
      border-right: 1px solid var(--border);
      z-index: 301;
      transition: left 0.3s ease;
      padding: max(env(safe-area-inset-top),20px) 0 20px;
      overflow-y: auto;
    }
    .drawer.active { left: 0; }
    .drawer-title {
      padding: 0 20px 16px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }
    .drawer-item:hover { background: var(--panel-hover); }
    .drawer-item.active { background: var(--panel); color: var(--accent); border-right: 3px solid var(--accent); }
    .drawer-item .di-icon { font-size: 1.3rem; width: 30px; text-align: center; }

    /* HEADER */
    .stats-bar {
      padding: max(env(safe-area-inset-top),12px) 16px 10px;
      padding-left: 60px;
      background: linear-gradient(to bottom, rgba(9,10,15,0.95), rgba(9,10,15,0.8));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    .realm-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
    .realm-name { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .currency-row { display: flex; gap: 10px; font-size: 0.7rem; }
    .currency-badge { padding: 2px 8px; border-radius: 10px; border: 1px solid; }
    .cb-insight { color: var(--gold); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.1); }
    .cb-stones { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.1); }
    .qi-main { font-size: 1.6rem; font-weight: 800; margin: 2px 0; }
    .qi-sub { font-size: 0.7rem; color: var(--text-dim); display: flex; gap: 12px; }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    /* CORE VIEW */
    .core-view { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 10px; }
    .spirit-core {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--accent), #312e81);
      border: 3px solid rgba(99,102,241,0.3);
      box-shadow: 0 0 40px var(--accent-glow);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem;
      user-select: none;
      transition: transform 0.05s;
      position: relative;
    }
    .spirit-core:active { transform: scale(0.92); }
    .float-qi {
      position: absolute; color: var(--gold); font-weight: 700; font-size: 1.1rem;
      pointer-events: none; animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity:1; transform: translateY(0) scale(1); }
      100% { opacity:0; transform: translateY(-50px) scale(0.7); }
    }
    .click-progress { width: 100%; max-width: 300px; }
    .cp-bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .cp-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.2s; }
    .cp-label { font-size: 0.7rem; color: var(--text-dim); text-align: center; margin-top: 4px; }

    /* ACTIVE SKILLS ROW */
    .skills-row {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      padding: 10px 0;
    }
    .skill-btn {
      width: 50px; height: 50px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .skill-btn.locked { opacity: 0.3; pointer-events: none; }
    .skill-btn.on-cd { opacity: 0.5; }
    .skill-btn .cd-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: white;
    }
    .skill-btn .skill-tip {
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      font-size: 0.55rem; color: var(--text-dim); white-space: nowrap;
    }

    /* CARDS */
    .list-view { display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }
    .section-title {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
      color: var(--text-dim); margin: 12px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
    }
    .card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer; transition: all 0.2s;
      position: relative;
    }
    .card:active { transform: scale(0.98); background: var(--panel-hover); }
    .card.disabled { opacity: 0.4; pointer-events: none; }
    .card.locked { opacity: 0.5; }
    .card-icon { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-weight: 700; font-size: 0.9rem; }
    .card-desc { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .card-cost { font-size: 0.7rem; font-weight: 700; color: var(--gold); margin-top: 3px; }
    .card-right { text-align: right; flex-shrink: 0; }

    /* PATH BORDERS */
    .path-orthodox { border-left: 4px solid var(--orthodox); }
    .path-demonic { border-left: 4px solid var(--demonic); }
    .path-chaotic { border-left: 4px solid var(--chaotic); }
    .path-body { border-left: 4px solid var(--body); }
    .path-spirit { border-left: 4px solid var(--spirit); }
    .path-void { border-left: 4px solid var(--void); }
    .path-sovereign { border-left: 4px solid var(--sovereign); }

    /* QUEST CARDS */
    .quest-card { border-left: 4px solid var(--accent); }
    .quest-progress { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; }
    .quest-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .quest-claim {
      padding: 6px 12px; background: var(--accent); color: white;
      border: none; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .quest-claim:disabled { opacity: 0.4; }

    /* SHOP */
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shop-item {
      padding: 12px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .shop-item:active { transform: scale(0.96); }
    .shop-item.disabled { opacity: 0.4; pointer-events: none; }
    .shop-item .si-icon { font-size: 2rem; margin-bottom: 6px; }
    .shop-item .si-name { font-size: 0.8rem; font-weight: 700; }
    .shop-item .si-desc { font-size: 0.65rem; color: var(--text-dim); margin: 4px 0; }
    .shop-item .si-cost { font-size: 0.75rem; color: #a78bfa; font-weight: 700; }

    /* TOAST */
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--panel); border: 1px solid var(--accent); backdrop-filter: blur(10px);
      padding: 10px 20px; border-radius: 12px; font-weight: 700; color: var(--accent);
      opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 500;
      text-align: center; font-size: 0.85rem; max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 400; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #13151a; border: 1px solid var(--accent); border-radius: 16px;
      padding: 24px; max-width: 340px; width: 100%; text-align: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 12px; }
    .modal-desc { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 16px; line-height: 1.5; }
    .modal-input {
      width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 1rem;
      text-align: center; margin-bottom: 12px; outline: none;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .btn-gold { background: var(--gold); color: #000; }

    /* CORRUPTION BAR */
    .corruption-bar {
      width: 100%; max-width: 300px; margin-top: 8px;
      padding: 8px 12px; background: rgba(107,114,128,0.1);
      border: 1px solid rgba(107,114,128,0.3); border-radius: 8px;
      font-size: 0.7rem; color: var(--void); text-align: center;
    }
  </style>
</head>

let currentView = "core";
let lastTick = Date.now();

// === INIT ===
function init() {
  loadGame();
  if (!state.identityCode) {
    state.identityCode = generateCode();
    if (state.identityCode === SECRET_CODE) {
      state.sovereignUnlocked = true;
    }
    saveGame();
    setTimeout(() => showToast(`Your Identity Sigil: ${state.identityCode}`), 1000);
  }
  if (state.identityCode === SECRET_CODE) state.sovereignUnlocked = true;
  setupDrawer();
  switchView("core");
  setInterval(gameTick, 100);
  setInterval(saveGame, 5000);
  setInterval(() => { state.playtime++; state.sessionClicks=0; state.sessionQi=0; state.sessionSkills=0; state.sessionRolls=0; }, 60000);
}

function generateCode() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let code = "";
  for (let i = 0; i < 10; i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

// === DRAWER ===
function setupDrawer() {
  document.querySelectorAll(".drawer-item").forEach(item => {
    item.addEventListener("click", () => {
      switchView(item.dataset.view);
      toggleDrawer();
    });
  });
}

function toggleDrawer() {
  document.getElementById("drawer").classList.toggle("active");
  document.getElementById("drawer-overlay").classList.toggle("active");
}

// === VIEW SWITCHING ===
function switchView(view) {
  currentView = view;
  document.querySelectorAll(".drawer-item").forEach(i => i.classList.toggle("active", i.dataset.view === view));
  const mc = document.getElementById("main-content");
  if (view === "core") renderCore(mc);
  else if (view === "forge") renderForge(mc);
  else if (view === "dao") renderDao(mc);
  else if (view === "mystic") renderMystic(mc);
  else if (view === "evolution") renderEvolution(mc);
  else if (view === "quests") renderQuests(mc);
  else if (view === "shop") renderShop(mc);
  else if (view === "ascend") renderAscend(mc);
}

// === RENDER: CORE ===
function renderCore(mc) {
  const slipTarget = hasSkill("SV3") ? 50 : (hasArtifact("slip_magnet") ? 80 : 100);
  const progress = Math.min((state.clicksToSlip / slipTarget) * 100, 100);
  
  let skillsHtml = ACTIVE_SKILLS.map(s => {
    const unlocked = isSkillUnlocked(s);
    const cd = state.skillCooldowns[s.id] || 0;
    const onCd = cd > 0;
    return `<div class="skill-btn ${unlocked?'':'locked'} ${onCd?'on-cd':''}" onclick="useActiveSkill('${s.id}')" title="${s.name}: ${s.desc}">
      ${s.icon}
      ${onCd ? `<div class="cd-overlay">${formatTime(cd)}</div>` : ''}
    </div>`;
  }).join('');

  let corruptionHtml = state.corruption > 0 ? `<div class="corruption-bar">⚠️ Corruption Level: ${state.corruption}</div>` : '';

  mc.innerHTML = `
    <div class="core-view">
      <div class="spirit-core" id="core-btn" style="font-size:2.8rem;">${SPECIES.find(s=>s.id===state.species)?.icon || '☯'}</div>
      <div class="click-progress">
        <div class="cp-bar"><div class="cp-fill" style="width:${progress}%"></div></div>
        <div class="cp-label">Jade Slip: ${state.clicksToSlip}/${slipTarget} clicks</div>
      </div>
      ${corruptionHtml}
      <div class="skills-row">${skillsHtml}</div>
      <div style="font-size:0.7rem; color:var(--text-dim); text-align:center;">
        ${state.title ? `Title: <span style="color:var(--gold)">${state.title}</span><br>` : ''}
        Reincarnations: ${state.reincarnations} | Global Mult: x${state.globalMult.toFixed(1)}
      </div>
    </div>
  `;
  
  const core = document.getElementById("core-btn");
  core.addEventListener("pointerdown", tapCore);
  core.addEventListener("touchstart", e => e.preventDefault(), {passive:false});
}

// === RENDER: DAO MATRIX ===
function renderDao(mc) {
  const paths = [
    { key:"orthodox", name:"☯️ Orthodox Dao", color:"var(--orthodox)" },
    { key:"demonic", name:"🩸 Demonic Path", color:"var(--demonic)" },
    { key:"chaotic", name:"⚡ Chaotic Dao", color:"var(--chaotic)" },
    { key:"body", name:"💪 Body Path", color:"var(--body)" },
    { key:"spirit", name:"🔮 Spirit Path", color:"var(--spirit)" },
    { key:"void", name:"🕳️ Void Path", color:"var(--void)" }
  ];
  if (state.sovereignUnlocked) {
    paths.push({ key:"sovereign", name:"👑 Sovereign's Path", color:"var(--sovereign)" });
  }

  let html = `<div class="list-view">`;
  paths.forEach(p => {
    html += `<div class="section-title" style="color:${p.color}">${p.name}</div>`;
    const skills = SKILL_TREE.filter(s => s.path === p.key && !s.id.startsWith("H"));
    skills.forEach(s => {
      const unlocked = state.skills.includes(s.id);
      const reqMet = checkReq(s);
      const cost = hasSkill("S3") ? Math.max(1, s.cost - 1) : s.cost;
      const canBuy = !unlocked && reqMet && state.insight >= cost;
      let cls = `card path-${s.path}`;
      if (unlocked) cls += ' disabled';
      else if (!reqMet) cls += ' locked';
      else if (!canBuy) cls += ' disabled';
      
      let reqText = s.requires.includes("ANY2") ? "Requires: 2 skills from different paths" : 
                    s.requires.length > 0 ? `Requires: ${s.requires.join(', ')}` : '';
      
      html += `<div class="${cls}" onclick="buySkillNode('${s.id}')">
        <div class="card-info">
          <div class="card-title">${s.name} ${unlocked?'✅':''}</div>
          <div class="card-desc">${s.desc}</div>
          ${reqText ? `<div class="card-desc" style="color:var(--text-dim);font-style:italic">${reqText}</div>` : ''}
          <div class="card-cost">${unlocked ? 'Mastered' : `Cost: ${cost} Insight`}</div>
        </div>
      </div>`;
    });
  });
  
  // Hybrids
  html += `<div class="section-title" style="color:var(--gold)">⚗️ Hybrid Skills</div>`;
  const hybrids = SKILL_TREE.filter(s => s.id.startsWith("H"));
  hybrids.forEach(s => {
    const unlocked = state.skills.includes(s.id);
    const reqMet = s.requires.every(r => state.skills.includes(r));
    const cost = hasSkill("S3") ? Math.max(1, s.cost - 1) : s.cost;
    const canBuy = !unlocked && reqMet && state.insight >= cost;
    let cls = `card path-${s.path}`;
    if (unlocked) cls += ' disabled';
    else if (!reqMet) cls += ' locked';
    else if (!canBuy) cls += ' disabled';
    
    html += `<div class="${cls}" onclick="buySkillNode('${s.id}')">
      <div class="card-info">
        <div class="card-title">${s.name} ${unlocked?'✅':''}</div>
        <div class="card-desc">${s.desc}</div>
        <div class="card-desc" style="font-style:italic">Requires: ${s.requires.join(' + ')}</div>
        <div class="card-cost">${unlocked ? 'Mastered' : `Cost: ${cost} Insight`}</div>
      </div>
    </div>`;
  });
  
  html += `</div>`;
  mc.innerHTML = html;
}

function renderQuests(mc) {
  const cats = ["Progression", "Repeatable", "Achievement"];
  let html = `<div class="list-view">`;
  cats.forEach(cat => {
    html += `<div class="section-title">${cat === 'Progression' ? '📖' : cat === 'Repeatable' ? '🔄' : '🏆'} ${cat}</div>`;
    const quests = QUESTS.filter(q => q.cat === cat);
    quests.forEach(q => {
      const completed = state.questCompleted[q.id];
      const progress = getQuestProgress(q);
      const pct = Math.min((progress / q.target) * 100, 100);
      const onCd = q.repeatable && state.questCooldowns[q.id] && state.questCooldowns[q.id] > Date.now();
      
      if (completed && q.oneTime) return; // Hide completed one-time quests
      
      let cls = `card quest-card ${completed || onCd ? 'disabled' : ''}`;
      let btnHtml = '';
      if (pct >= 100 && !completed && !onCd) {

      } else if (onCd) {
        const remaining = Math.ceil((state.questCooldowns[q.id] - Date.now()) / 1000);
        btnHtml = `<span style="font-size:0.65rem;color:var(--text-dim);">${formatTime(remaining)}</span>`;
      }
      
      html += `<div class="${cls}">
        <div class="card-info">
          <div class="card-title">${q.name}</div>
          <div class="card-desc">${q.desc}</div>
          <div class="card-desc" style="color:var(--gold);">Reward: ${formatReward(q.reward)}</div>

    });
  });
  html += `</div>`;

}

// === GAME LOGIC ===
function tapCore(e) {
  let base = getTapPower();
  let final = base;
  
  // Chaotic variance
  if (hasSkill("C1") || hasSkill("C2")) {
    if (hasSkill("H2")) { final = base * (3 + Math.random()*2); }
    else if (hasSkill("C5")) { final = base * (2 + Math.random()*3); }
    else if (hasSkill("C2")) { final = base * (0.5 + Math.random()*7.5); }
    else { final = base * (0.1 + Math.random()*4.9); }
  }
  
  // Demonic crit
  if (hasSkill("D2") && Math.random() < 0.05) {
    final *= 10;
    showToast("⚡ Soul Siphoned! 10x Qi!");
  }
  
  // Golden Touch
  if (state.goldenTouchTaps > 0) {
    final *= 10;
    state.goldenTouchTaps--;
  }
  
  // Active buffs
  if (state.activeBuffs.tap_5x && state.activeBuffs.tap_5x > Date.now()) final *= 5;
  if (state.activeBuffs.surge && state.activeBuffs.surge > Date.now()) final *= 1.5;
  
  state.qi += final;
  state.totalQi += final;
  state.clicks++;
  state.clicksToSlip++;
  state.sessionClicks++;
  
  const slipTarget = hasSkill("SV3") ? 50 : (hasArtifact("slip_magnet") ? 80 : 100);
  if (state.clicksToSlip >= slipTarget) {
    state.clicksToSlip = 0;
    state.jadeSlips++;
    showToast("🟢 Jade Slip earned!");
    updateQuestProgress("slips", 1);
  }
  
  checkRealm();
  updateQuestProgress("clicks", 1);
  updateQuestProgress("clicks_session", 1);
  updateQuestProgress("totalQi", final);
  updateQuestProgress("qi_session", final);
  
  spawnFloat(e, final);
  updateUI();
  if (currentView === "core") renderCore(document.getElementById("main-content"));
}

function gameTick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  
  // QPS
  let qps = getQPS();
  if (state.activeBuffs.qps_double && state.activeBuffs.qps_double > Date.now()) qps *= 2;
  if (state.activeBuffs.qps_pill && state.activeBuffs.qps_pill > Date.now()) qps *= 2;
  if (state.activeBuffs.surge && state.activeBuffs.surge > Date.now()) qps *= 1.5;
  
  if (qps > 0) {
    const gain = qps * dt;
    state.qi += gain;
    state.totalQi += gain;
    state.sessionQi += gain;
  }
  
  // Cooldowns
  Object.keys(state.skillCooldowns).forEach(k => {
    if (state.skillCooldowns[k] > 0) state.skillCooldowns[k] -= dt;
    if (state.skillCooldowns[k] < 0) state.skillCooldowns[k] = 0;
  });
  
  checkRealm();
  updateQuestProgress("playtime", dt);
  updateUI();
}

// === CALCULATIONS ===
function getTapPower() {
  let base = 1;
  UPGRADES.filter(u=>u.type==='tap').forEach(u => base += (state.upgrades[u.id]||0)*u.value);
  let mult = 1;
  let allMult = state.globalMult;
  
  SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s => {
    if (s.effect.tap_mult) mult += s.effect.tap_mult;
    if (s.effect.all_mult) allMult += s.effect.all_mult;
  });
  
  // Species bonus
  const sp = SPECIES.find(s=>s.id===state.species);
  if (sp && sp.bonus.tap_mult) mult += sp.bonus.tap_mult;
  if (sp && sp.bonus.all_mult) allMult += sp.bonus.all_mult;
  
  // Body pill permanent
  if (state.artifacts.includes("body_pill_perm")) mult += 0.1;
  
  // Corruption penalty
  if (state.corruption >= 3 && !hasSkill("H6")) mult *= 0.8;
  
  return Math.max(1, base * mult * allMult);
}

function getQPS() {
  let base = 0;
  UPGRADES.filter(u=>u.type==='auto').forEach(u => base += (state.upgrades[u.id]||0)*u.value);
  let mult = 1;
  let allMult = state.globalMult;
  
  SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s => {
    if (s.effect.qps_mult) mult += s.effect.qps_mult;
    if (s.effect.all_mult) allMult += s.effect.all_mult;
  });
  
  // Equipment
  if (state.equipment) {
    const eq = SHOP_ITEMS.find(i=>i.id===state.equipment);
    if (eq && eq.effect.qps_mult) mult += eq.effect.qps_mult;
  }
  
  // Species
  const sp = SPECIES.find(s=>s.id===state.species);
  if (sp && sp.bonus.qps_mult) mult += sp.bonus.qps_mult;
  if (sp && sp.bonus.all_mult) allMult += sp.bonus.all_mult;
  
  // Corruption penalty
  if (state.corruption >= 3 && !hasSkill("H6")) mult *= 0.8;
  if (state.corruption >= 5) return 0;
  
  return Math.max(0, base * mult * allMult);
}

function getInsightMult() {
  let mult = 1;
  SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s => {
    if (s.effect.insight_mult) mult += s.effect.insight_mult;
  });
  const sp = SPECIES.find(s=>s.id===state.species);
  if (sp && sp.bonus.insight_mult) mult += sp.bonus.insight_mult;
  if (state.equipment) {
    const eq = SHOP_ITEMS.find(i=>i.id===state.equipment);
    if (eq && eq.effect.insight_mult) mult += eq.effect.insight_mult;
  }
  return mult;
}

function getUpgCost(u) { return Math.floor(u.baseCost * Math.pow(u.costMult, state.upgrades[u.id]||0)); }

function hasSkill(id) { return state.skills.includes(id); }
function hasArtifact(id) { return state.artifacts.includes(id); }

function checkReq(skill) {
  if (skill.requires.includes("ANY2")) {
    const paths = new Set(SKILL_TREE.filter(s=>state.skills.includes(s.id) && !s.id.startsWith("H")).map(s=>s.path));
    return paths.size >= 2;
  }
  return skill.requires.every(r => state.skills.includes(r));
}

function isSkillUnlocked(as) {
  if (as.unlock === "free") return true;
  if (as.unlock.startsWith("quest:")) return state.questCompleted[as.unlock.replace("quest:","")];
  if (as.unlock === "demonic3") return state.skills.filter(s=>s.startsWith("D")).length >= 3;
  if (as.unlock === "void2") return state.skills.includes("V2");
  if (as.unlock.startsWith("species:")) return state.unlockedSpecies.includes(as.unlock.replace("species:",""));
  if (as.unlock.startsWith("shop:")) return state.artifacts.includes(as.unlock) || state.activeSkills.includes(as.id);
  return false;
}

// === ACTIONS ===
function buyUpg(id) {
  const u = UPGRADES.find(x=>x.id===id);
  const cost = getUpgCost(u);
  if (state.qi >= cost) {
    state.qi -= cost;
    state.upgrades[u.id] = (state.upgrades[u.id]||0) + 1;
    updateQuestProgress("upgrades", 1);
    updateUI();
    if (currentView==="forge") renderForge(document.getElementById("main-content"));
  }
}

function buySkillNode(id) {
  const s = SKILL_TREE.find(x=>x.id===id);
  if (state.skills.includes(id)) return;
  if (!checkReq(s)) return;
  const cost = hasSkill("S3") ? Math.max(1, s.cost-1) : s.cost;
  if (state.insight < cost) return;
  
  state.insight -= cost;
  state.skills.push(id);
  if (s.effect.corruption) state.corruption += s.effect.corruption;
  
  updateQuestProgress("skills", 1);
  updateQuestProgress("skills_session", 1);
  if (s.path === "void") updateQuestProgress("void_skills", 1);
  if (state.corruption >= 5) updateQuestProgress("corruption", state.corruption);
  
  showToast(`Mastered: ${s.name}`);
  saveGame();
  if (currentView==="dao") renderDao(document.getElementById("main-content"));
  updateUI();
}

function useActiveSkill(id) {
  const as = ACTIVE_SKILLS.find(s=>s.id===id);
  if (!isSkillUnlocked(as)) return;
  if (state.skillCooldowns[id] > 0) return;
  
  let cd = as.cd;
  if (hasSkill("SV2")) cd /= 2;
  state.skillCooldowns[id] = cd;
  
  if (as.effect === "qps_double") state.activeBuffs.qps_double = Date.now() + as.duration*1000;
  else if (as.effect === "qi_burst") { state.qi += getQPS()*60; state.totalQi += getQPS()*60; }
  else if (as.effect === "tap_5x") { state.qi *= 0.95; state.activeBuffs.tap_5x = Date.now() + as.duration*1000; }
  else if (as.effect === "time_fold") { state.qi += getQPS()*600; state.totalQi += getQPS()*600; }
  else if (as.effect === "insight_gain") { state.insight += 1; }
  else if (as.effect === "golden_touch") { state.goldenTouchTaps = 10; }
  else if (as.effect === "surge") { state.activeBuffs.surge = Date.now() + as.duration*1000; }
  else if (as.effect === "void_step") { state.qi += 100000; state.totalQi += 100000; state.corruption++; }
  
  showToast(`⚡ ${as.name} activated!`);
  if (currentView==="core") renderCore(document.getElementById("main-content"));
  updateUI();
}

function openJadeSlip() {
  if (state.jadeSlips < 1) return;
  state.jadeSlips--;
  const roll = Math.random();
  let msg = "";
  if (roll < 0.7) { const q = 500 + Math.floor(Math.random()*1500); state.qi += q; state.totalQi += q; msg = `+${q} Qi`; }
  else if (roll < 0.9) { const q = 5000 + Math.floor(Math.random()*10000); state.qi += q; state.totalQi += q; msg = `+${formatNum(q)} Qi`; }
  else if (roll < 0.98) { state.insight++; msg = "+1 Dao Insight"; }
  else { state.stones++; msg = "+1 Spirit Stone 💎"; }
  showToast(`🟢 Jade Slip: ${msg}`);
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));
  updateUI();
}

function mergeJadeToVoucher() {
  if (state.jadeSlips < 5) return;
  state.jadeSlips -= 5;
  state.giftVouchers++;
  state.totalMerges++;
  updateQuestProgress("merges", 1);
  showToast("🎁 Merged 5 Jade Slips → 1 Gift Voucher!");
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));
}

function mergeVoucherToGolden() {

  state.giftVouchers -= 5;
  state.goldenVouchers++;
  showToast("✨ Merged 5 Vouchers → 1 Golden Voucher!");
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));

function splitGolden() {

  state.goldenVouchers--;
  state.giftVouchers += 5;
  showToast("↩️ Split 1 Golden → 5 Vouchers");
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));
}

function rollVoucher() {
  if (state.giftVouchers < 1) return;
  state.giftVouchers--;
  state.totalRolls++;
  updateQuestProgress("rolls", 1);
  updateQuestProgress("rolls_session", 1);
  
  const luckBonus = hasSkill("C3") ? 0.1 : 0;
  const artifactLuck = hasArtifact("lucky_charm") ? 0.05 : 0;
  const rngMult = hasSkill("H5") ? 2 : (hasSkill("C4") ? 1.5 : 1);
  
  let roll = Math.random() - luckBonus - artifactLuck;
  let msg = "";
  if (roll < 0.02 * rngMult) { const q = 5000000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=50; unlockRandomSkill(); msg = `MYTHIC! +${formatNum(q)} Qi +50 Insight +Free Skill!`; }
  else if (roll < 0.08) { const q = 1000000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=15; msg = `LEGENDARY! +${formatNum(q)} Qi +15 Insight`; }
  else if (roll < 0.20) { const q = 200000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=5; msg = `EPIC! +${formatNum(q)} Qi +5 Insight`; }
  else if (roll < 0.50) { const q = 50000*rngMult; state.qi+=q; state.totalQi+=q; msg = `RARE! +${formatNum(q)} Qi`; }
  else { const q = 10000*rngMult; state.qi+=q; state.totalQi+=q; msg = `Common: +${formatNum(q)} Qi`; }
  
  showToast(`🎲 ${msg}`);
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));
  updateUI();
}

function rollGolden() {
  if (state.goldenVouchers < 1) return;
  state.goldenVouchers--;
  state.totalRolls++;
  const rngMult = hasSkill("H5") ? 2 : (hasSkill("C4") ? 1.5 : 1);
  
  let roll = Math.random();
  let msg = "";
  if (roll < 0.10) { const q = 50000000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=200; state.globalMult+=0.2; msg = `DIVINE! +${formatNum(q)} Qi +200 Insight +20% Global!`; }
  else if (roll < 0.25) { const q = 10000000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=75; msg = `MYTHIC! +${formatNum(q)} Qi +75 Insight`; }
  else if (roll < 0.60) { const q = 2000000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=30; msg = `LEGENDARY! +${formatNum(q)} Qi +30 Insight`; }
  else { const q = 500000*rngMult; state.qi+=q; state.totalQi+=q; state.insight+=10; msg = `EPIC! +${formatNum(q)} Qi +10 Insight`; }
  
  showToast(`🌟 ${msg}`);
  if (currentView==="mystic") renderMystic(document.getElementById("main-content"));
  updateUI();
}

function unlockRandomSkill() {
  const available = SKILL_TREE.filter(s => !state.skills.includes(s.id) && !s.id.startsWith("SV") && checkReq(s));
  if (available.length > 0) {
    const pick = available[Math.floor(Math.random()*available.length)];
    state.skills.push(pick.id);
    showToast(`🎁 Free Skill: ${pick.name}!`);
  }
}

function evolveSpecies(id) {
  const sp = SPECIES.find(s=>s.id===id);
  if (state.species === id) return;
  
  if (state.unlockedSpecies.includes(id)) {
    if (state.qi >= 1000) {
      state.qi -= 1000;
      state.species = id;
      showToast(`Switched to ${sp.name}!`);
    }
  } else {
    if (sp.cost.secret && !state.sovereignUnlocked) return;
    if (!checkSpeciesCost(sp)) return;
    if (sp.cost.qi) state.qi -= sp.cost.qi;
    if (sp.cost.insight) state.insight -= sp.cost.insight;
    state.unlockedSpecies.push(id);
    state.species = id;
    state.totalEvolutions++;
    updateQuestProgress("evolutions", 1);
    updateQuestProgress("species_count", state.unlockedSpecies.length);
    showToast(`🧬 Evolved into ${sp.name}!`);
  }
  saveGame();
  if (currentView==="evolution") renderEvolution(document.getElementById("main-content"));
  if (currentView==="core") renderCore(document.getElementById("main-content"));
  updateUI();
}

function checkSpeciesCost(sp) {
  if (sp.cost.secret) return state.sovereignUnlocked;
  if (sp.cost.reincarnations) return state.reincarnations >= sp.cost.reincarnations;
  if (sp.cost.qi && state.qi < sp.cost.qi) return false;
  if (sp.cost.insight && state.insight < sp.cost.insight) return false;
  return true;
}

function formatSpeciesCost(cost) {
  let parts = [];
  if (cost.qi) parts.push(`${formatNum(cost.qi)} Qi`);
  if (cost.insight) parts.push(`${cost.insight} Insight`);
  if (cost.reincarnations) parts.push(`${cost.reincarnations} Reincarnations`);
  return parts.join(" + ") || "Free";
}

function buyShopItem(id) {
  const item = SHOP_ITEMS.find(i=>i.id===id);
  if (state.stones < item.cost) return;
  
  if (item.type === 'equipment' && state.equipment === id) return;
  if (item.type === 'artifact' && state.artifacts.includes(id)) return;
  
  state.stones -= item.cost;
  
  if (item.type === 'consumable') {
    if (item.effect === 'qps_pill') state.activeBuffs.qps_pill = Date.now() + 300000;
    else if (item.effect === 'insight_pill') state.insight++;
    else if (item.effect === 'tap_perm') state.artifacts.push("body_pill_perm");
    else if (item.effect === 'cleanse') state.corruption = 0;
    else if (item.effect === 'rebirth_keep') state.rebirthKeepSkills = true;
    showToast(`Used ${item.name}!`);
  } else if (item.type === 'equipment') {
    state.equipment = id;
    if (item.effect.corruption) state.corruption += item.effect.corruption;
    showToast(`Equipped ${item.name}!`);
  } else if (item.type === 'artifact') {
    state.artifacts.push(id);
    if (item.effect.unlock_void) showToast("Void Path Unlocked!");
    showToast(`Acquired ${item.name}!`);
  }
  
  updateQuestProgress("shop_buys", 1);
  saveGame();
  if (currentView==="shop") renderShop(document.getElementById("main-content"));
  updateUI();
}

// === QUESTS ===
function getQuestProgress(q) {
  switch(q.type) {
    case "clicks": return state.clicks;
    case "totalQi": return state.totalQi;
    case "upgrades": return Object.values(state.upgrades).reduce((a,b)=>a+b, 0);
    case "realm": return state.currentRealm || 0;
    case "skills": return state.skills.length;
    case "slips": return state.totalRolls > 0 ? state.jadeSlips + state.totalMerges*5 + state.giftVouchers + state.goldenVouchers*5 : state.jadeSlips;
    case "rolls": return state.totalRolls;
    case "merges": return state.totalMerges;
    case "evolutions": return state.totalEvolutions;
    case "playtime": return state.playtime;
    case "reincarnations": return state.reincarnations;
    case "void_skills": return state.skills.filter(s=>s.startsWith("V")).length;
    case "clicks_session": return state.sessionClicks;
    case "qi_session": return state.sessionQi;
    case "skills_session": return state.sessionSkills;
    case "rolls_session": return state.sessionRolls;
    case "species_count": return state.unlockedSpecies.length;
    case "corruption": return state.corruption;
    default: return 0;
  }
}

function updateQuestProgress(type, amount) {
  QUESTS.filter(q => q.type === type && !state.questCompleted[q.id]).forEach(q => {
    if (!state.questProgress[q.id]) state.questProgress[q.id] = 0;
    state.questProgress[q.id] += amount;
  });
}

function claimQuest(id, e) {
  e.stopPropagation();
  const q = QUESTS.find(x=>x.id===id);
  const progress = getQuestProgress(q);
  if (progress < q.target) return;
  
  if (state.questCompleted[q.id] && q.oneTime) return;
  if (q.repeatable && state.questCooldowns[q.id] && state.questCooldowns[q.id] > Date.now()) return;
  
  // Grant rewards
  if (q.reward.stones) state.stones += q.reward.stones;
  if (q.reward.skill) state.activeSkills.push(q.reward.skill);
  if (q.reward.title) state.title = q.reward.title;
  
  state.questCompleted[q.id] = true;
  if (q.repeatable) {
    state.questCooldowns[q.id] = Date.now() + q.cd * 1000;
    state.questCompleted[q.id] = false; // Allow repeat
    // Reset session counters for repeatable
    if (q.type === "clicks_session") state.sessionClicks = 0;
    if (q.type === "qi_session") state.sessionQi = 0;
    if (q.type === "skills_session") state.sessionSkills = 0;
    if (q.type === "rolls_session") state.sessionRolls = 0;
  }
  
  showToast(`📜 Quest Complete: ${q.name}! +${q.reward.stones||0} 💎`);
  saveGame();
  if (currentView==="quests") renderQuests(document.getElementById("main-content"));
  updateUI();
}

function formatReward(r) {
  let parts = [];
  if (r.stones) parts.push(`${r.stones} 💎`);
  if (r.skill) parts.push(`Skill: ${r.skill}`);
  if (r.title) parts.push(`Title: ${r.title}`);
  return parts.join(", ");
}

// === REALM & REINCARNATION ===
function checkRealm() {
  let newRealm = 0;
  for (let i = REALMS.length-1; i >= 0; i--) {
    if (state.totalQi >= REALMS[i].threshold) { newRealm = i; break; }
  }
  if (newRealm > (state.currentRealm || 0)) {
    state.currentRealm = newRealm;
    const r = REALMS[newRealm];
    let insightGain = Math.floor(r.insight * getInsightMult());
    if (hasSkill("SV4")) insightGain += 10;
    state.insight += insightGain;
    updateQuestProgress("realm", newRealm);
    showToast(`🌟 BREAKTHROUGH: ${r.name}! +${insightGain} Insight`);
  }
}

function openReincarnateModal() {
  showModal("🔥 Reincarnate?", 
    `Sever your cultivation.<br>Lose Qi, Upgrades, Skills.<br>Keep Insight & Stones.<br>Gain <strong>+20% Global Mult</strong>.`,
    [
      { text: "Remain", cls: "btn-secondary", action: "closeModal()" },
      { text: "Reincarnate", cls: "btn-primary", action: "doReincarnate()" }
    ]);
}

function doReincarnate() {
  state.reincarnations++;
  state.globalMult += 0.2;
  state.qi = 0; state.totalQi = 0;
  state.upgrades = {};
  
  if (state.rebirthKeepSkills) {
    state.rebirthKeepSkills = false;
  } else if (hasArtifact("soul_lantern")) {
    const keep = state.skills.sort(()=>0.5-Math.random()).slice(0,3);
    state.skills = keep;
  } else {
    state.skills = [];
  }
  
  state.currentRealm = 0;
  state.corruption = 0;
  state.species = "human";
  state.clicksToSlip = 0;
  state.goldenTouchTaps = 0;
  state.activeBuffs = {};
  state.equipment = null;
  
  updateQuestProgress("reincarnations", 1);
  closeModal();
  showToast(`🔥 Reborn! Global Mult: x${state.globalMult.toFixed(1)}`);
  saveGame();
  switchView("core");
  updateUI();
}

// === SECRET CODE ===
function enterSecretCode() {
  const input = document.getElementById("secret-code-input");
  const code = input.value.trim().toUpperCase();
  if (code === SECRET_CODE) {
    state.sovereignUnlocked = true;
    showToast("👑 SOVEREIGN'S PATH UNLOCKED! You are the true Sect Leader.");
    saveGame();
    input.value = "";
  } else if (code === state.identityCode) {
    showToast("✅ Identity verified. Save transfer ready.");
  } else {
    showToast("❌ Invalid code.");
  }
}

// === UI HELPERS ===
function updateUI() {
  document.getElementById("realm-name").textContent = REALMS[state.currentRealm||0].name;
  document.getElementById("insight-badge").textContent = `✨ ${state.insight}`;
  document.getElementById("stones-badge").textContent = `💎 ${state.stones}`;
  document.getElementById("qi-main").textContent = formatNum(state.qi);
  document.getElementById("qps-display").textContent = `${formatNum(getQPS())} Qi/sec`;
  document.getElementById("tap-display").textContent = `${formatNum(getTapPower())} Qi/tap`;
}

function spawnFloat(e, amt) {
  const el = document.createElement("div");
  el.className = "float-qi";
  el.textContent = `+${formatNum(amt)}`;
  const rect = e.target.getBoundingClientRect();
  el.style.left = `${(e.clientX||rect.left+rect.width/2)-rect.left}px`;
  el.style.top = `${(e.clientY||rect.top+rect.height/2)-rect.top}px`;
  e.target.parentElement.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 3000);
}

function showModal(title, desc, buttons, showInput=false) {
  document.getElementById("modal-title").innerHTML = title;
  document.getElementById("modal-desc").innerHTML = desc;
  document.getElementById("modal-input").style.display = showInput ? "block" : "none";
  const btns = document.getElementById("modal-btns");
  btns.innerHTML = buttons.map(b => `<button class="btn ${b.cls}" onclick="${b.action}">${b.text}</button>`).join('');
  document.getElementById("modal-generic").classList.add("active");
}

function closeModal() {
  document.getElementById("modal-generic").classList.remove("active");
}

function formatNum(n) {
  if (n < 1000) return Math.floor(n).toLocaleString();
  if (n < 1e6) return (n/1e3).toFixed(1)+"K";
  if (n < 1e9) return (n/1e6).toFixed(1)+"M";
  return (n/1e9).toFixed(1)+"B";
}

function formatTime(s) {
  if (s < 60) return `${Math.floor(s)}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${Math.floor(s%60)}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

// === SAVE/LOAD ===
function saveGame() {
  try { localStorage.setItem("nexus-dao-matrix-save", JSON.stringify(state)); } catch(e){}
}

function loadGame() {
  try {
    const s = localStorage.getItem("nexus-dao-matrix-save");
    if (s) {
      const parsed = JSON.parse(s);
      state = { ...state, ...parsed };
      if (!state.upgrades) state.upgrades = {};
      if (!state.skills) state.skills = [];
      if (!state.unlockedSpecies) state.unlockedSpecies = ["human"];
      if (!state.questProgress) state.questProgress = {};
      if (!state.questCompleted) state.questCompleted = {};
      if (!state.questCooldowns) state.questCooldowns = {};
      if (!state.skillCooldowns) state.skillCooldowns = {};
      if (!state.activeBuffs) state.activeBuffs = {};
      if (!state.artifacts) state.artifacts = [];
      if (!state.activeSkills) state.activeSkills = [];
    }
  } catch(e){}
}

// GO
init();
</script>
</body>
</html>
