<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dao Matrix | Nexus Gate</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <style>
    :root {
      --bg:#090a0f;--panel:rgba(255,255,255,0.04);--panel-hover:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.08);--accent:#6366f1;--accent-glow:rgba(99,102,241,0.4);
      --text:#e2e8f0;--text-dim:#94a3b8;--gold:#fbbf24;
      --orthodox:#3b82f6;--demonic:#ef4444;--chaotic:#f59e0b;--body:#22c55e;
      --spirit:#a855f7;--void:#6b7280;--sovereign:#f59e0b;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);font-family:"Georgia","Merriweather",serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

    /* HAMBURGER & CLOSE */
    .hamburger{position:fixed;top:max(env(safe-area-inset-top),12px);left:16px;z-index:200;width:40px;height:40px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:1.3rem}
    .close-sigil{position:fixed;top:max(env(safe-area-inset-top),12px);right:16px;z-index:200;width:40px;height:40px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text-dim);font-size:1.1rem}

    /* DRAWER */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s}
    .drawer-overlay.active{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0d0f14;border-right:1px solid var(--border);z-index:301;transition:left 0.3s ease;padding:max(env(safe-area-inset-top),20px) 0 20px;overflow-y:auto}
    .drawer.active{left:0}
    .drawer-title{padding:0 20px 16px;font-size:1.2rem;font-weight:800;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:8px}
    .drawer-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background 0.2s;font-size:0.95rem}
    .drawer-item:hover{background:var(--panel-hover)}
    .drawer-item.active{background:var(--panel);color:var(--accent);border-right:3px solid var(--accent)}
    .di-icon{font-size:1.3rem;width:30px;text-align:center}

    /* HEADER */
    .stats-bar{padding:max(env(safe-area-inset-top),12px) 16px 10px;padding-left:60px;background:linear-gradient(to bottom,rgba(9,10,15,0.95),rgba(9,10,15,0.8));backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:50}
    .realm-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
    .realm-name{font-size:1rem;font-weight:700;color:var(--accent)}
    .currency-row{display:flex;gap:8px;font-size:0.65rem}
    .cb{padding:2px 7px;border-radius:10px;border:1px solid}
    .cb-i{color:var(--gold);border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.1)}
    .cb-s{color:#a78bfa;border-color:rgba(167,139,250,0.3);background:rgba(167,139,250,0.1)}
    .cb-d{color:#f87171;border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.1)}
    .qi-main{font-size:1.6rem;font-weight:800;margin:2px 0}
    .qi-sub{font-size:0.7rem;color:var(--text-dim);display:flex;gap:12px}

    /* MAIN */
    .main-content{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}
    .main-content::-webkit-scrollbar{display:none}

    /* CORE */
    .core-view{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
    .spirit-core{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#312e81);border:3px solid rgba(99,102,241,0.3);box-shadow:0 0 40px var(--accent-glow);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.8rem;user-select:none;transition:transform 0.05s;position:relative}
    .spirit-core:active{transform:scale(0.92)}
    .float-qi{position:absolute;color:var(--gold);font-weight:700;font-size:1.1rem;pointer-events:none;animation:floatUp 0.8s ease-out forwards}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(0.7)}}
    .cp-bar{width:100%;max-width:300px;height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:4px}
    .cp-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.2s}
    .cp-label{font-size:0.7rem;color:var(--text-dim);text-align:center;margin-top:4px}

    /* SKILLS ROW */
    .skills-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px 0}
    .skill-btn{width:46px;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;position:relative;transition:all 0.2s}
    .skill-btn.locked{opacity:0.3;pointer-events:none}
    .skill-btn.on-cd{opacity:0.5}
    .cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:0.55rem;color:white}

    /* CARDS */
    .list-view{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
    .section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
    .card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;position:relative}
    .card:active{transform:scale(0.98);background:var(--panel-hover)}
    .card.disabled{opacity:0.4;pointer-events:none}
    .card.locked{opacity:0.5}
    .card-icon{font-size:1.5rem;width:36px;text-align:center;flex-shrink:0}
    .card-info{flex:1;min-width:0}
    .card-title{font-weight:700;font-size:0.9rem}
    .card-desc{font-size:0.7rem;color:var(--text-dim);margin-top:2px}
    .card-cost{font-size:0.7rem;font-weight:700;color:var(--gold);margin-top:3px}
    .card-right{text-align:right;flex-shrink:0}

    /* PATH BORDERS */
    .p-orthodox{border-left:4px solid var(--orthodox)}.p-demonic{border-left:4px solid var(--demonic)}
    .p-chaotic{border-left:4px solid var(--chaotic)}.p-body{border-left:4px solid var(--body)}
    .p-spirit{border-left:4px solid var(--spirit)}.p-void{border-left:4px solid var(--void)}
    .p-sovereign{border-left:4px solid var(--sovereign)}

    /* QUEST */
    .quest-card{border-left:4px solid var(--accent)}
    .q-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:6px}
    .q-fill{height:100%;background:var(--accent);border-radius:2px}
    .q-claim{padding:6px 12px;background:var(--accent);color:white;border:none;border-radius:6px;font-size:0.7rem;font-weight:700;cursor:pointer;font-family:inherit}
    .q-claim:disabled{opacity:0.4}

    /* SHOP GRID */
    .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .shop-item{padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all 0.2s}
    .shop-item:active{transform:scale(0.96)}
    .shop-item.disabled{opacity:0.4;pointer-events:none}
    .si-icon{font-size:2rem;margin-bottom:6px}
    .si-name{font-size:0.8rem;font-weight:700}
    .si-desc{font-size:0.65rem;color:var(--text-dim);margin:4px 0}
    .si-cost{font-size:0.75rem;color:#a78bfa;font-weight:700}

    /* DEFENSE */
    .wave-banner{text-align:center;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
    .wave-num{font-size:1.5rem;font-weight:800;color:#f87171}
    .hp-bar{height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:8px;overflow:hidden}
    .hp-fill{height:100%;background:#f87171;border-radius:4px;transition:width 0.3s}
    .defender-card{border-left:4px solid #f87171}

    /* TOAST */
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--panel);border:1px solid var(--accent);backdrop-filter:blur(10px);padding:10px 20px;border-radius:12px;font-weight:700;color:var(--accent);opacity:0;pointer-events:none;transition:all 0.3s;z-index:500;text-align:center;font-size:0.85rem;max-width:90%}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:400;padding:20px}
    .modal-overlay.active{display:flex}
    .modal-box{background:#13151a;border:1px solid var(--accent);border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center}
    .modal-title{font-size:1.2rem;font-weight:800;color:var(--accent);margin-bottom:12px}
    .modal-desc{font-size:0.8rem;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
    .modal-input{width:100%;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:1rem;text-align:center;margin-bottom:12px;outline:none;text-transform:uppercase}
    .modal-input:focus{border-color:var(--accent)}
    .modal-btns{display:flex;gap:10px}
    .btn{flex:1;padding:12px;border-radius:8px;border:none;font-family:inherit;font-weight:700;cursor:pointer;font-size:0.85rem}
    .btn-p{background:var(--accent);color:white}.btn-s{background:var(--panel);color:var(--text);border:1px solid var(--border)}
    .btn-g{background:var(--gold);color:#000}

    .corruption-bar{width:100%;max-width:300px;padding:8px 12px;background:rgba(107,114,128,0.1);border:1px solid rgba(107,114,128,0.3);border-radius:8px;font-size:0.7rem;color:var(--void);text-align:center}
  </style>
</head>
<body>

<div class="hamburger" onclick="toggleDrawer()">☰</div>
<a href="./index.html" class="close-sigil">✕</a>

<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-title">☰ Nexus Gate</div>
  <div class="drawer-item active" data-view="core"><span class="di-icon">☯</span>Core</div>
  <div class="drawer-item" data-view="forge"><span class="di-icon">⚒️</span>Forge</div>

  <div class="drawer-item" data-view="defense"><span class="di-icon">🛡️</span>Defense</div>
  <div class="drawer-item" data-view="mystic"><span class="di-icon">🎲</span>Mystic</div>
  <div class="drawer-item" data-view="evolution"><span class="di-icon">🧬</span>Evolution</div>

  <div class="drawer-item" data-view="ascend"><span class="di-icon">🔥</span>Ascend</div>
</div>

<div class="stats-bar">
  <div class="realm-row">
    <div class="realm-name" id="realm-name">Mortal</div>
    <div class="currency-row">
      <span class="cb cb-i" id="insight-badge">✨ 0</span>

      <span class="cb cb-d" id="dp-badge">🛡️ 0</span>

  </div>
  <div class="qi-main" id="qi-main">0</div>
  <div class="qi-sub">

    <span id="tap-display">1 Qi/tap</span>
  </div>
</div>

<div class="main-content" id="main-content"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-generic">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <input class="modal-input" id="modal-input" style="display:none" placeholder="Enter code...">
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

// === INIT ===
function init(){
  loadGame();
  if(!state.identityCode){
    state.identityCode=genCode();
    saveGame();
    setTimeout(()=>showToast(`Your Identity Sigil: ${state.identityCode}`),1000);
  }
  setupDrawer();
  switchView("core");
  setInterval(gameTick,100);
  setInterval(saveGame,5000);
  setInterval(()=>{state.playtime++;state.sessionClicks=0;state.sessionQi=0;state.sessionSkills=0;state.sessionRolls=0},60000);
}

function genCode(){
  const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ";let s="";
  for(let i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

// === DRAWER ===
function setupDrawer(){
  document.querySelectorAll(".drawer-item").forEach(i=>{
    i.addEventListener("click",()=>{switchView(i.dataset.view);toggleDrawer()});
  });
}
function toggleDrawer(){
  document.getElementById("drawer").classList.toggle("active");
  document.getElementById("drawer-overlay").classList.toggle("active");
}

// === VIEW SWITCH ===
function switchView(v){
  currentView=v;
  document.querySelectorAll(".drawer-item").forEach(i=>i.classList.toggle("active",i.dataset.view===v));
  const mc=document.getElementById("main-content");
  const R={core:renderCore,forge:renderForge,dao:renderDao,defense:renderDefense,mystic:renderMystic,evolution:renderEvolution,quests:renderQuests,shop:renderShop,ascend:renderAscend};
  if(R[v])R[v](mc);
}

// === RENDER: CORE ===
function renderCore(mc){
  const st=hasSkill("SV3")?50:(hasArtifact("slip_magnet")?80:100);
  const pct=Math.min((state.clicksToSlip/st)*100,100);
  let sk=ACTIVE_SKILLS.map(s=>{
    const ul=isSkillUnlocked(s);const cd=state.skillCooldowns[s.id]||0;const onCd=cd>0;
    return `<div class="skill-btn ${ul?'':'locked'} ${onCd?'on-cd':''}" onclick="useActiveSkill('${s.id}')" title="${s.name}: ${s.desc}">${s.icon}${onCd?`<div class="cd-overlay">${fmtTime(cd)}</div>`:''}</div>`;
  }).join('');
  let cor=state.corruption>0?`<div class="corruption-bar">⚠️ Corruption: ${state.corruption}</div>`:'';
  mc.innerHTML=`<div class="core-view">
    <div class="spirit-core" id="core-btn">${SPECIES.find(s=>s.id===state.species)?.icon||'☯'}</div>
    <div style="width:100%;max-width:300px"><div class="cp-bar"><div class="cp-fill" style="width:${pct}%"></div></div>
    <div class="cp-label">Jade Slip: ${state.clicksToSlip}/${st}</div></div>

    <div style="font-size:0.7rem;color:var(--text-dim);text-align:center">
      ${state.title?`Title: <span style="color:var(--gold)">${state.title}</span><br>`:''}
      Reincarnations: ${state.reincarnations} | Mult: x${state.globalMult.toFixed(1)}
      ${state.isAdmin?'<br><span style="color:var(--sovereign)">👑 Sovereign Access</span>':''}
    </div></div>`;
  const core=document.getElementById("core-btn");
  core.addEventListener("pointerdown",tapCore);

}

// === RENDER: DAO ===
function renderDao(mc){
  const paths=[{k:"orthodox",n:"☯️ Orthodox",c:"var(--orthodox)"},{k:"demonic",n:"🩸 Demonic",c:"var(--demonic)"},{k:"chaotic",n:"⚡ Chaotic",c:"var(--chaotic)"},{k:"body",n:"💪 Body",c:"var(--body)"},{k:"spirit",n:"🔮 Spirit",c:"var(--spirit)"},{k:"void",n:"🕳️ Void",c:"var(--void)"}];
  if(state.sovereignUnlocked)paths.push({k:"sovereign",n:"👑 Sovereign",c:"var(--sovereign)"});
  let h=`<div class="list-view">`;
  paths.forEach(p=>{
    h+=`<div class="section-title" style="color:${p.c}">${p.n}</div>`;
    SKILL_TREE.filter(s=>s.path===p.k&&!s.id.startsWith("H")).forEach(s=>{
      const ul=state.skills.includes(s.id);const rm=checkReq(s);
      const cost=hasSkill("S3")?Math.max(1,s.cost-1):s.cost;
      const can=!ul&&rm&&state.insight>=cost;
      let cls=`card p-${s.path}`;if(ul)cls+=' disabled';else if(!rm)cls+=' locked';else if(!can)cls+=' disabled';
      let req=s.requires.includes("ANY2")?"Req: 2 skills from diff paths":s.requires.length?`Req: ${s.requires.join(', ')}`:'';
      h+=`<div class="${cls}" onclick="buySkillNode('${s.id}')"><div class="card-info"><div class="card-title">${s.name} ${ul?'✅':''}</div><div class="card-desc">${s.desc}</div>${req?`<div class="card-desc" style="font-style:italic">${req}</div>`:''}<div class="card-cost">${ul?'Mastered':`Cost: ${cost} Insight`}</div></div></div>`;
    });
  });
  h+=`<div class="section-title" style="color:var(--gold)">⚗️ Hybrid Skills</div>`;
  SKILL_TREE.filter(s=>s.id.startsWith("H")).forEach(s=>{
    const ul=state.skills.includes(s.id);const rm=s.requires.every(r=>state.skills.includes(r));
    const cost=hasSkill("S3")?Math.max(1,s.cost-1):s.cost;
    const can=!ul&&rm&&state.insight>=cost;
    let cls=`card p-${s.path}`;if(ul)cls+=' disabled';else if(!rm)cls+=' locked';else if(!can)cls+=' disabled';
    h+=`<div class="${cls}" onclick="buySkillNode('${s.id}')"><div class="card-info"><div class="card-title">${s.name} ${ul?'✅':''}</div><div class="card-desc">${s.desc}</div><div class="card-desc" style="font-style:italic">Req: ${s.requires.join(' + ')}</div><div class="card-cost">${ul?'Mastered':`Cost: ${cost} Insight`}</div></div></div>`;
  });
  mc.innerHTML=h+`</div>`;
}

// === RENDER: QUESTS ===
function renderQuests(mc){
  const cats=["Progression","Repeatable","Achievement"];
  let h=`<div class="list-view">`;
  cats.forEach(cat=>{
    h+=`<div class="section-title">${cat==='Progression'?'📖':cat==='Repeatable'?'🔄':'🏆'} ${cat}</div>`;
    QUESTS.filter(q=>q.cat===cat).forEach(q=>{
      const done=state.questCompleted[q.id];const prog=getQP(q);const pct=Math.min((prog/q.target)*100,100);
      const onCd=q.repeatable&&state.questCooldowns[q.id]&&state.questCooldowns[q.id]>Date.now();
      if(done&&q.oneTime)return;
      let cls=`card quest-card ${done||onCd?'disabled':''}`;
      let btn='';
      if(pct>=100&&!done&&!onCd)btn=`<button class="q-claim" onclick="claimQuest('${q.id}',event)">Claim</button>`;
      else if(onCd){const rem=Math.ceil((state.questCooldowns[q.id]-Date.now())/1000);btn=`<span style="font-size:0.65rem;color:var(--text-dim)">${fmtTime(rem)}</span>`;}
      h+=`<div class="${cls}"><div class="card-info"><div class="card-title">${q.name}</div><div class="card-desc">${q.desc}</div><div class="card-desc" style="color:var(--gold)">Reward: ${fmtReward(q.reward)}</div><div class="q-bar"><div class="q-fill" style="width:${pct}%"></div></div><div style="font-size:0.6rem;color:var(--text-dim);margin-top:2px">${Math.floor(prog)} / ${q.target}</div></div><div class="card-right">${btn}</div></div>`;
    });
  });
  mc.innerHTML=h+`</div>`;
}

// === GAME LOGIC ===
function tapCore(e){
  let base=getTapPower();let final=base;
  if(hasSkill("C1")||hasSkill("C2")){
    if(hasSkill("H2"))final=base*(3+Math.random()*2);
    else if(hasSkill("C5"))final=base*(2+Math.random()*3);
    else if(hasSkill("C2"))final=base*(0.5+Math.random()*7.5);
    else final=base*(0.1+Math.random()*4.9);
  }
  if(hasSkill("D2")&&Math.random()<0.05){final*=10;showToast("⚡ Soul Siphoned! 10x!");}
  if(state.goldenTouchTaps>0){final*=10;state.goldenTouchTaps--;}
  if(state.activeBuffs.tap_5x&&state.activeBuffs.tap_5x>Date.now())final*=5;
  if(state.activeBuffs.surge&&state.activeBuffs.surge>Date.now())final*=1.5;
  state.qi+=final;state.totalQi+=final;state.clicks++;state.clicksToSlip++;state.sessionClicks++;
  const st=hasSkill("SV3")?50:(hasArtifact("slip_magnet")?80:100);
  if(state.clicksToSlip>=st){state.clicksToSlip=0;state.jadeSlips++;state.slipsEarned++;showToast("🟢 Jade Slip earned!");updateQP("slips_earned",1);}
  checkRealm();updateQP("clicks",1);updateQP("clicks_session",1);updateQP("totalQi",final);updateQP("qi_session",final);
  spawnFloat(e,final);updateUI();
  if(currentView==="core")renderCore(document.getElementById("main-content"));
}

function gameTick(){
  const now=Date.now();const dt=(now-lastTick)/1000;lastTick=now;
  let qps=getQPS();
  if(state.activeBuffs.qps_double&&state.activeBuffs.qps_double>now)qps*=2;
  if(state.activeBuffs.qps_pill&&state.activeBuffs.qps_pill>now)qps*=2;
  if(state.activeBuffs.surge&&state.activeBuffs.surge>now)qps*=1.5;
  if(qps>0){const g=qps*dt;state.qi+=g;state.totalQi+=g;state.sessionQi+=g;}
  Object.keys(state.skillCooldowns).forEach(k=>{if(state.skillCooldowns[k]>0)state.skillCooldowns[k]-=dt;if(state.skillCooldowns[k]<0)state.skillCooldowns[k]=0;});
  // Defense tick
  if(state.waveActive){
    const dps=getTotalDPS();
    state.waveHP-=dps*dt;
    if(state.waveHP<=0){
      state.waveHP=0;state.waveActive=false;state.wave++;
      const dpReward=Math.floor(20*Math.pow(1.3,state.wave));
      state.dp+=dpReward;
      updateQP("waves",1);
      showToast(`🛡️ Wave ${state.wave} cleared! +${dpReward} DP`);
    }
  }
  checkRealm();updateQP("playtime",dt);updateUI();
  if(currentView==="defense")renderDefense(document.getElementById("main-content"));
}

// === CALCULATIONS ===
function getTapPower(){
  let base=1;UPGRADES.filter(u=>u.type==='tap').forEach(u=>base+=(state.upgrades[u.id]||0)*u.value);
  let mult=1;let am=state.globalMult;
  SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s=>{if(s.effect.tap_mult)mult+=s.effect.tap_mult;if(s.effect.all_mult)am+=s.effect.all_mult;});
  const sp=SPECIES.find(s=>s.id===state.species);if(sp?.bonus.tap_mult)mult+=sp.bonus.tap_mult;if(sp?.bonus.all_mult)am+=sp.bonus.all_mult;
  if(state.artifacts.includes("body_pill_perm"))mult+=0.1;
  if(state.corruption>=3&&!hasSkill("H6"))mult*=0.8;
  return Math.max(1,base*mult*am);
}
function getQPS(){
  let base=0;UPGRADES.filter(u=>u.type==='auto').forEach(u=>base+=(state.upgrades[u.id]||0)*u.value);
  let mult=1;let am=state.globalMult;
  SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s=>{if(s.effect.qps_mult)mult+=s.effect.qps_mult;if(s.effect.all_mult)am+=s.effect.all_mult;});
  if(state.equipment){const eq=SHOP_ITEMS.find(i=>i.id===state.equipment);if(eq?.effect.qps_mult)mult+=eq.effect.qps_mult;}
  const sp=SPECIES.find(s=>s.id===state.species);if(sp?.bonus.qps_mult)mult+=sp.bonus.qps_mult;if(sp?.bonus.all_mult)am+=sp.bonus.all_mult;
  if(state.corruption>=3&&!hasSkill("H6"))mult*=0.8;
  if(state.corruption>=5)return 0;
  return Math.max(0,base*mult*am);
}
function getTotalDPS(){
  let dps=0;DEFENDERS.forEach(d=>{dps+=(state.defenders[d.id]||0)*d.dps;});return dps;
}
function getInsightMult(){
  let m=1;SKILL_TREE.filter(s=>state.skills.includes(s.id)).forEach(s=>{if(s.effect.insight_mult)m+=s.effect.insight_mult;});
  const sp=SPECIES.find(s=>s.id===state.species);if(sp?.bonus.insight_mult)m+=sp.bonus.insight_mult;
  if(state.equipment){const eq=SHOP_ITEMS.find(i=>i.id===state.equipment);if(eq?.effect.insight_mult)m+=eq.effect.insight_mult;}
  return m;
}
function getUpgCost(u){return Math.floor(u.baseCost*Math.pow(u.costMult,state.upgrades[u.id]||0));}
function hasSkill(id){return state.skills.includes(id);}
function hasArtifact(id){return state.artifacts.includes(id);}
function checkReq(s){
  if(s.requires.includes("ANY2")){const p=new Set(SKILL_TREE.filter(sk=>state.skills.includes(sk.id)&&!sk.id.startsWith("H")).map(sk=>sk.path));return p.size>=2;}
  return s.requires.every(r=>state.skills.includes(r));
}
function isSkillUnlocked(as){
  if(as.unlock==="free")return true;
  if(as.unlock.startsWith("quest:"))return state.questCompleted[as.unlock.replace("quest:","")];
  if(as.unlock==="demonic3")return state.skills.filter(s=>s.startsWith("D")).length>=3;
  if(as.unlock==="void2")return state.skills.includes("V2");
  if(as.unlock.startsWith("species:"))return state.unlockedSpecies.includes(as.unlock.replace("species:",""));
  return false;
}

// === ACTIONS ===
function buyUpg(id){const u=UPGRADES.find(x=>x.id===id);const c=getUpgCost(u);if(state.qi>=c){state.qi-=c;state.upgrades[u.id]=(state.upgrades[u.id]||0)+1;updateQP("upgrades",1);updateUI();if(currentView==="forge")renderForge(document.getElementById("main-content"));}}

function buySkillNode(id){
  const s=SKILL_TREE.find(x=>x.id===id);if(state.skills.includes(id)||!checkReq(s))return;
  const cost=hasSkill("S3")?Math.max(1,s.cost-1):s.cost;if(state.insight<cost)return;
  state.insight-=cost;state.skills.push(id);
  if(s.effect.corruption)state.corruption+=s.effect.corruption;
  updateQP("skills",1);updateQP("skills_session",1);
  if(s.path==="void")updateQP("void_skills",1);
  if(state.corruption>=5)updateQP("corruption",state.corruption);
  showToast(`Mastered: ${s.name}`);saveGame();if(currentView==="dao")renderDao(document.getElementById("main-content"));updateUI();
}

function useActiveSkill(id){
  const as=ACTIVE_SKILLS.find(s=>s.id===id);if(!isSkillUnlocked(as)||(state.skillCooldowns[id]||0)>0)return;
  let cd=as.cd;if(hasSkill("SV2"))cd/=2;state.skillCooldowns[id]=cd;
  if(as.effect==="qps_double")state.activeBuffs.qps_double=Date.now()+as.dur*1000;
  else if(as.effect==="qi_burst"){state.qi+=getQPS()*60;state.totalQi+=getQPS()*60;}
  else if(as.effect==="tap_5x"){state.qi*=0.95;state.activeBuffs.tap_5x=Date.now()+as.dur*1000;}
  else if(as.effect==="time_fold"){state.qi+=getQPS()*600;state.totalQi+=getQPS()*600;}
  else if(as.effect==="insight_gain")state.insight++;
  else if(as.effect==="golden_touch")state.goldenTouchTaps=10;
  else if(as.effect==="surge")state.activeBuffs.surge=Date.now()+as.dur*1000;
  else if(as.effect==="void_step"){state.qi+=100000;state.totalQi+=100000;state.corruption++;}
  showToast(`⚡ ${as.name}!`);if(currentView==="core")renderCore(document.getElementById("main-content"));updateUI();
}

// === MYSTIC ACTIONS ===
function openJadeSlip(){if(state.jadeSlips<1)return;state.jadeSlips--;const r=Math.random();let m="";if(r<0.7){const q=500+Math.floor(Math.random()*1500);state.qi+=q;state.totalQi+=q;m=`+${q} Qi`;}else if(r<0.9){const q=5000+Math.floor(Math.random()*10000);state.qi+=q;state.totalQi+=q;m=`+${fmtNum(q)} Qi`;}else if(r<0.98){state.insight++;m="+1 Insight";}else{state.stones++;m="+1 💎";}showToast(`🟢 ${m}`);if(currentView==="mystic")renderMystic(document.getElementById("main-content"));updateUI();}
function mergeJade(){if(state.jadeSlips<5)return;state.jadeSlips-=5;state.giftVouchers++;state.totalMerges++;updateQP("merges",1);showToast("🎁 5 Jade → 1 Voucher!");if(currentView==="mystic")renderMystic(document.getElementById("main-content"));}
function mergeGolden(){if(state.giftVouchers<5)return;state.giftVouchers-=5;state.goldenVouchers++;showToast("✨ 5 Vouchers → 1 Golden!");if(currentView==="mystic")renderMystic(document.getElementById("main-content"));}
function splitGolden(){if(state.goldenVouchers<1)return;state.goldenVouchers--;state.giftVouchers+=5;showToast("↩️ 1 Golden → 5 Vouchers");if(currentView==="mystic")renderMystic(document.getElementById("main-content"));}
function rollVoucher(){if(state.giftVouchers<1)return;state.giftVouchers--;state.totalRolls++;updateQP("rolls",1);updateQP("rolls_session",1);const lb=hasSkill("C3")?0.1:0;const al=hasArtifact("lucky_charm")?0.05:0;const rm=hasSkill("H5")?2:(hasSkill("C4")?1.5:1);let r=Math.random()-lb-al;let m="";if(r<0.02*rm){const q=5000000*rm;state.qi+=q;state.totalQi+=q;state.insight+=50;unlockRandomSkill();m=`MYTHIC! +${fmtNum(q)} Qi +50 Insight +Skill!`;}else if(r<0.08){const q=1000000*rm;state.qi+=q;state.totalQi+=q;state.insight+=15;m=`LEGENDARY! +${fmtNum(q)} Qi +15 Insight`;}else if(r<0.20){const q=200000*rm;state.qi+=q;state.totalQi+=q;state.insight+=5;m=`EPIC! +${fmtNum(q)} Qi +5 Insight`;}else if(r<0.50){const q=50000*rm;state.qi+=q;state.totalQi+=q;m=`RARE! +${fmtNum(q)} Qi`;}else{const q=10000*rm;state.qi+=q;state.totalQi+=q;m=`Common: +${fmtNum(q)} Qi`;}showToast(`🎲 ${m}`);if(currentView==="mystic")renderMystic(document.getElementById("main-content"));updateUI();}
function rollGolden(){if(state.goldenVouchers<1)return;state.goldenVouchers--;state.totalRolls++;const rm=hasSkill("H5")?2:(hasSkill("C4")?1.5:1);let r=Math.random();let m="";if(r<0.10){const q=50000000*rm;state.qi+=q;state.totalQi+=q;state.insight+=200;state.globalMult+=0.2;m=`DIVINE! +${fmtNum(q)} Qi +200 Insight +20% Global!`;}else if(r<0.25){const q=10000000*rm;state.qi+=q;state.totalQi+=q;state.insight+=75;m=`MYTHIC! +${fmtNum(q)} Qi +75 Insight`;}else if(r<0.60){const q=2000000*rm;state.qi+=q;state.totalQi+=q;state.insight+=30;m=`LEGENDARY! +${fmtNum(q)} Qi +30 Insight`;}else{const q=500000*rm;state.qi+=q;state.totalQi+=q;state.insight+=10;m=`EPIC! +${fmtNum(q)} Qi +10 Insight`;}showToast(`🌟 ${m}`);if(currentView==="mystic")renderMystic(document.getElementById("main-content"));updateUI();}
function unlockRandomSkill(){const av=SKILL_TREE.filter(s=>!state.skills.includes(s.id)&&!s.id.startsWith("SV")&&checkReq(s));if(av.length){const p=av[Math.floor(Math.random()*av.length)];state.skills.push(p.id);showToast(`🎁 Free Skill: ${p.name}!`);}}

  state.waveHP=state.waveMaxHP;
  state.waveActive=true;
  showToast(`⚔️ Wave ${state.wave+1} started!`);

function buyDefender(id){

  const cost=Math.floor(d.baseCost*Math.pow(d.costMult,cnt));

// === EVOLUTION ===
function evolveSpecies(id){
  const sp=SPECIES.find(s=>s.id===id);if(state.species===id)return;
  if(state.unlockedSpecies.includes(id)){if(state.qi>=1000){state.qi-=1000;state.species=id;showToast(`Switched to ${sp.name}!`);}}
  else{if(sp.cost.secret&&!state.sovereignUnlocked)return;if(!checkSpCost(sp))return;if(sp.cost.qi)state.qi-=sp.cost.qi;if(sp.cost.insight)state.insight-=sp.cost.insight;state.unlockedSpecies.push(id);state.species=id;state.totalEvolutions++;updateQP("evolutions",1);updateQP("species_count",state.unlockedSpecies.length);showToast(`🧬 Evolved: ${sp.name}!`);}
  saveGame();if(currentView==="evolution")renderEvolution(document.getElementById("main-content"));if(currentView==="core")renderCore(document.getElementById("main-content"));updateUI();
}
function checkSpCost(sp){if(sp.cost.secret)return state.sovereignUnlocked;if(sp.cost.reincarnations)return state.reincarnations>=sp.cost.reincarnations;if(sp.cost.qi&&state.qi<sp.cost.qi)return false;if(sp.cost.insight&&state.insight<sp.cost.insight)return false;return true;}
function fmtSpCost(c){let p=[];if(c.qi)p.push(`${fmtNum(c.qi)} Qi`);if(c.insight)p.push(`${c.insight} Insight`);if(c.reincarnations)p.push(`${c.reincarnations} Reincarnations`);return p.join(" + ")||"Free";}

// === SHOP ===
function buyShopItem(id){
  const item=SHOP_ITEMS.find(i=>i.id===id);if(state.stones<item.cost)return;
  if(item.type==='equipment'&&state.equipment===id)return;
  if(item.type==='artifact'&&state.artifacts.includes(id))return;
  state.stones-=item.cost;
  if(item.type==='consumable'){if(item.effect==='qps_pill')state.activeBuffs.qps_pill=Date.now()+300000;else if(item.effect==='insight_pill')state.insight++;else if(item.effect==='tap_perm')state.artifacts.push("body_pill_perm");else if(item.effect==='cleanse')state.corruption=0;else if(item.effect==='rebirth_keep')state.rebirthKeepSkills=true;showToast(`Used ${item.name}!`);}
  else if(item.type==='equipment'){state.equipment=id;if(item.effect.corruption)state.corruption+=item.effect.corruption;showToast(`Equipped ${item.name}!`);}
  else if(item.type==='artifact'){state.artifacts.push(id);showToast(`Acquired ${item.name}!`);}
  saveGame();if(currentView==="shop")renderShop(document.getElementById("main-content"));updateUI();
}

// === QUESTS ===
function getQP(q){
  switch(q.type){case"clicks":return state.clicks;case"totalQi":return state.totalQi;case"upgrades":return Object.values(state.upgrades).reduce((a,b)=>a+b,0);case"realm":return state.currentRealm||0;case"skills":return state.skills.length;case"slips_earned":return state.slipsEarned;case"rolls":return state.totalRolls;case"merges":return state.totalMerges;case"evolutions":return state.totalEvolutions;case"playtime":return state.playtime;case"reincarnations":return state.reincarnations;case"void_skills":return state.skills.filter(s=>s.startsWith("V")).length;case"clicks_session":return state.sessionClicks;case"qi_session":return state.sessionQi;case"skills_session":return state.sessionSkills;case"rolls_session":return state.sessionRolls;case"species_count":return state.unlockedSpecies.length;case"corruption":return state.corruption;case"waves":return state.wave;default:return 0;}
}
function updateQP(type,amt){QUESTS.filter(q=>q.type===type&&!state.questCompleted[q.id]).forEach(q=>{if(!state.questProgress[q.id])state.questProgress[q.id]=0;state.questProgress[q.id]+=amt;});}
function claimQuest(id,e){
  e.stopPropagation();const q=QUESTS.find(x=>x.id===id);if(getQP(q)<q.target)return;
  if(state.questCompleted[q.id]&&q.oneTime)return;
  if(q.repeatable&&state.questCooldowns[q.id]&&state.questCooldowns[q.id]>Date.now())return;
  if(q.reward.stones)state.stones+=q.reward.stones;
  if(q.reward.skill)state.activeSkills.push(q.reward.skill);
  if(q.reward.title)state.title=q.reward.title;
  state.questCompleted[q.id]=true;
  if(q.repeatable){state.questCooldowns[q.id]=Date.now()+q.cd*1000;state.questCompleted[q.id]=false;if(q.type==="clicks_session")state.sessionClicks=0;if(q.type==="qi_session")state.sessionQi=0;if(q.type==="skills_session")state.sessionSkills=0;if(q.type==="rolls_session")state.sessionRolls=0;}
  showToast(`📜 ${q.name}! +${q.reward.stones||0} 💎`);saveGame();if(currentView==="quests")renderQuests(document.getElementById("main-content"));updateUI();
}
function fmtReward(r){let p=[];if(r.stones)p.push(`${r.stones} 💎`);if(r.skill)p.push(`Skill`);if(r.title)p.push(`Title`);return p.join(", ");}

// === REALM & REINCARNATION ===
function checkRealm(){
  let nr=0;for(let i=REALMS.length-1;i>=0;i--){if(state.totalQi>=REALMS[i].threshold){nr=i;break;}}
  if(nr>(state.currentRealm||0)){state.currentRealm=nr;const r=REALMS[nr];let ig=Math.floor(r.insight*getInsightMult());if(hasSkill("SV4"))ig+=10;state.insight+=ig;updateQP("realm",nr);showToast(`🌟 ${r.name}! +${ig} Insight`);}
}
function openReincarnateModal(){showModal("🔥 Reincarnate?",`Sever cultivation. Lose Qi, Upgrades, Skills.<br>Keep Insight & Stones. Gain <strong>+20% Global Mult</strong>.`,[{text:"Remain",cls:"btn-s",action:"closeModal()"},{text:"Reincarnate",cls:"btn-p",action:"doReincarnate()"}]);}
function doReincarnate(){
  state.reincarnations++;state.globalMult+=0.2;state.qi=0;state.totalQi=0;state.upgrades={};
  if(state.rebirthKeepSkills){state.rebirthKeepSkills=false;}else if(hasArtifact("soul_lantern")){state.skills=state.skills.sort(()=>0.5-Math.random()).slice(0,3);}else{state.skills=[];}
  state.currentRealm=0;state.corruption=0;state.species="human";state.clicksToSlip=0;state.goldenTouchTaps=0;state.activeBuffs={};state.equipment=null;
  updateQP("reincarnations",1);closeModal();showToast(`🔥 Reborn! x${state.globalMult.toFixed(1)}`);saveGame();switchView("core");updateUI();
}

// === UI HELPERS ===
function updateUI(){
  document.getElementById("realm-name").textContent=REALMS[state.currentRealm||0].name;
  document.getElementById("insight-badge").textContent=`✨ ${state.insight}`;
  document.getElementById("stones-badge").textContent=`💎 ${state.stones}`;
  document.getElementById("dp-badge").textContent=`🛡️ ${state.dp}`;
  document.getElementById("qi-main").textContent=fmtNum(state.qi);
  document.getElementById("qps-display").textContent=`${fmtNum(getQPS())} Qi/sec`;
  document.getElementById("tap-display").textContent=`${fmtNum(getTapPower())} Qi/tap`;
}
function spawnFloat(e,amt){const el=document.createElement("div");el.className="float-qi";el.textContent=`+${fmtNum(amt)}`;const r=e.target.getBoundingClientRect();el.style.left=`${(e.clientX||r.left+r.width/2)-r.left}px`;el.style.top=`${(e.clientY||r.top+r.height/2)-r.top}px`;e.target.parentElement.appendChild(el);setTimeout(()=>el.remove(),800);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
function showModal(title,desc,btns,showInput=false){document.getElementById("modal-title").innerHTML=title;document.getElementById("modal-desc").innerHTML=desc;document.getElementById("modal-input").style.display=showInput?"block":"none";document.getElementById("modal-btns").innerHTML=btns.map(b=>`<button class="btn ${b.cls}" onclick="${b.action}">${b.text}</button>`).join('');document.getElementById("modal-generic").classList.add("active");}
function closeModal(){document.getElementById("modal-generic").classList.remove("active");}
function fmtNum(n){if(n<1000)return Math.floor(n).toLocaleString();if(n<1e6)return(n/1e3).toFixed(1)+"K";if(n<1e9)return(n/1e6).toFixed(1)+"M";return(n/1e9).toFixed(1)+"B";}
function fmtTime(s){if(s<60)return`${Math.floor(s)}s`;if(s<3600)return`${Math.floor(s/60)}m`;return`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;}

// === SAVE/LOAD ===
function saveGame(){try{localStorage.setItem("nexus-dao-matrix-save",JSON.stringify(state));}catch(e){}}
function loadGame(){try{const s=localStorage.getItem("nexus-dao-matrix-save");if(s){const p=JSON.parse(s);state={...state,...p};if(!state.upgrades)state.upgrades={};if(!state.skills)state.skills=[];if(!state.unlockedSpecies)state.unlockedSpecies=["human"];if(!state.questProgress)state.questProgress={};if(!state.questCompleted)state.questCompleted={};if(!state.questCooldowns)state.questCooldowns={};if(!state.skillCooldowns)state.skillCooldowns={};if(!state.activeBuffs)state.activeBuffs={};if(!state.artifacts)state.artifacts=[]};if(!state.activeSkills)state.activeSkills=[];if(!state.defenders)state.defenders={};}}catch(e){}}

init();
</script>
</body>
