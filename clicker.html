<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dao Matrix | Nexus Gate</title>
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<style>
:root{--bg:#090a0f;--panel:rgba(255,255,255,.04);--panel-h:rgba(255,255,255,.08);--border:rgba(255,255,255,.08);--accent:#6366f1;--glow:rgba(99,102,241,.4);--text:#e2e8f0;--dim:#94a3b8;--gold:#fbbf24;--orthodox:#3b82f6;--demonic:#ef4444;--chaotic:#f59e0b;--body:#22c55e;--spirit:#a855f7;--void:#6b7280;--sovereign:#f59e0b;--mana:#06b6d4;--se:#f87171}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Georgia,Merriweather,serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
canvas#particles{position:fixed;inset:0;pointer-events:none;z-index:10}

/* NAV */
.hamburger{position:fixed;top:max(env(safe-area-inset-top),12px);left:16px;z-index:200;width:40px;height:40px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:1.3rem}
.close-sigil{position:fixed;top:max(env(safe-area-inset-top),12px);right:16px;z-index:200;width:40px;height:40px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--dim);font-size:1.1rem}
.help-btn{position:fixed;bottom:max(env(safe-area-inset-bottom),16px);right:16px;z-index:200;width:44px;height:44px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.4rem;font-weight:700;box-shadow:0 0 20px var(--glow)}

/* DRAWER */
.dov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.dov.active{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0d0f14;border-right:1px solid var(--border);z-index:301;transition:left .3s;padding:max(env(safe-area-inset-top),20px) 0 20px;overflow-y:auto}
.drawer.active{left:0}
.dt{padding:0 20px 16px;font-size:1.2rem;font-weight:800;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:8px}
.di{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background .2s;font-size:.95rem}
.di:hover{background:var(--panel-h)}
.di.active{background:var(--panel);color:var(--accent);border-right:3px solid var(--accent)}
.di-i{font-size:1.3rem;width:30px;text-align:center}

/* HEADER */
.sb{padding:max(env(safe-area-inset-top),12px) 16px 10px;padding-left:60px;padding-right:60px;background:linear-gradient(to bottom,rgba(9,10,15,.95),rgba(9,10,15,.8));backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:50}
.sr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.rn{font-size:1rem;font-weight:700;color:var(--accent)}
.cr{display:flex;gap:6px;font-size:.6rem;flex-wrap:wrap}
.cb{padding:2px 6px;border-radius:10px;border:1px solid}
.ci{color:var(--gold);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1)}
.cs{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.1)}
.cd{color:var(--se);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.1)}
.cm{color:var(--mana);border-color:rgba(6,182,212,.3);background:rgba(6,182,212,.1)}
.qm{font-size:1.6rem;font-weight:800;margin:2px 0}
.qs{font-size:.7rem;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.un{font-size:.65rem;color:var(--dim);margin-top:2px}

/* MAIN */
.mc{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}
.mc::-webkit-scrollbar{display:none}

/* CORE */
.cv{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.core-container{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;z-index:5}
.sc{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#312e81);border:3px solid rgba(99,102,241,.3);box-shadow:0 0 50px var(--glow);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:4.5rem;user-select:none;transition:transform .05s;position:relative;z-index:5}
.sc:active{transform:scale(.92)}
.orbit-wrapper{position:absolute;width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 12s linear infinite;pointer-events:none;z-index:4}
@keyframes spin{100%{transform:translate(-50%,-50%) rotate(360deg)}}
.sat-core{position:absolute;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#818cf8,#312e81);border:2px solid rgba(255,255,255,.3);box-shadow:0 0 15px var(--glow);top:50%;left:50%;margin:-21px 0 0 -21px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;animation:counter-spin 12s linear infinite}
@keyframes counter-spin{100%{transform:rotate(-360deg)}}
.fq{position:absolute;color:var(--gold);font-weight:700;font-size:1.1rem;pointer-events:none;animation:fu .8s ease-out forwards;z-index:15}
@keyframes fu{0%{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-50px) scale(.7)}}
.cpb{width:100%;max-width:300px;height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:4px}
.cpf{height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.cpl{font-size:.7rem;color:var(--dim);text-align:center;margin-top:4px}
.combo-bar{width:100%;max-width:300px;height:4px;background:var(--panel);border-radius:2px;overflow:hidden;margin-top:2px}
.combo-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .1s}
.combo-label{font-size:.65rem;color:var(--gold);text-align:center}

/* SKILLS ROW */
.skr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.sk{width:46px;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;position:relative;transition:all .2s}
.sk.lk{opacity:.3;pointer-events:none}
.sk.oc{opacity:.5}
.cdo{position:absolute;inset:0;background:rgba(0,0,0,.6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#fff}

/* CARDS */
.lv{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.st{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.cd{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;position:relative}
.cd:active{transform:scale(.98);background:var(--panel-h)}
.cd.dis{opacity:.4;pointer-events:none}
.cd.lk{opacity:.5}
.cdi{font-size:1.5rem;width:36px;text-align:center;flex-shrink:0}
.cdn{flex:1;min-width:0}
.cdt{font-weight:700;font-size:.9rem}
.cdd{font-size:.7rem;color:var(--dim);margin-top:2px}
.cdc{font-size:.7rem;font-weight:700;color:var(--gold);margin-top:3px}
.cdr{text-align:right;flex-shrink:0}

/* PATHS */
.po{border-left:4px solid var(--orthodox)}.pd{border-left:4px solid var(--demonic)}
.pc{border-left:4px solid var(--chaotic)}.pb{border-left:4px solid var(--body)}
.ps{border-left:4px solid var(--spirit)}.pv{border-left:4px solid var(--void)}
.psv{border-left:4px solid var(--sovereign)}.pw{border-left:4px solid var(--se)}

/* QUEST */
.qc{border-left:4px solid var(--accent)}
.qb{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px}
.qf{height:100%;background:var(--accent);border-radius:2px}
.qcl{padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit}
.qcl:disabled{opacity:.4}

/* SHOP */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si{padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all .2s}
.si:active{transform:scale(.96)}
.si.dis{opacity:.4;pointer-events:none}
.sii{font-size:2rem;margin-bottom:6px}
.sin{font-size:.8rem;font-weight:700}
.sid{font-size:.65rem;color:var(--dim);margin:4px 0}
.sic{font-size:.75rem;color:#a78bfa;font-weight:700}

/* DEFENSE */
.wb{text-align:center;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.wn{font-size:1.5rem;font-weight:800;color:var(--se)}
.hpb{height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:8px;overflow:hidden}
.hpf{height:100%;background:var(--se);border-radius:4px;transition:width .3s}
.dc{border-left:4px solid var(--se)}

/* DUNGEON GRID */
.dg-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.dg-grid{display:grid;gap:4px;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.dg-cell{width:48px;height:48px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:all .2s;position:relative}
.dg-cell:hover{background:var(--panel-h)}
.dg-cell.owned{border-color:var(--accent);background:rgba(99,102,241,.1)}
.dg-cell.locked{opacity:.3;cursor:not-allowed}
.dg-cell .trap-dot{position:absolute;bottom:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--se)}
.dg-palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dg-pal-item{padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.7rem;text-align:center;transition:all .2s}
.dg-pal-item.selected{border-color:var(--accent);background:rgba(99,102,241,.15)}
.dg-pal-item.dis{opacity:.4;pointer-events:none}
.dg-stats{display:flex;gap:12px;font-size:.7rem;color:var(--dim);flex-wrap:wrap;justify-content:center}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--panel);border:1px solid var(--accent);backdrop-filter:blur(10px);padding:10px 20px;border-radius:12px;font-weight:700;color:var(--accent);opacity:0;pointer-events:none;transition:all .3s;z-index:500;text-align:center;font-size:.85rem;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:400;padding:20px}
.mo.active{display:flex}
.mb{background:#13151a;border:1px solid var(--accent);border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;max-height:80vh;overflow-y:auto}
.mt{font-size:1.2rem;font-weight:800;color:var(--accent);margin-bottom:12px}
.md{font-size:.8rem;color:var(--dim);margin-bottom:16px;line-height:1.5}
.mi{width:100%;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:1rem;text-align:center;margin-bottom:12px;outline:none;text-transform:uppercase}
.mi:focus{border-color:var(--accent)}
.mbs{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:8px;border:none;font-family:inherit;font-weight:700;cursor:pointer;font-size:.85rem;min-width:80px}
.bp{background:var(--accent);color:#fff}.bs{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.bg{background:var(--gold);color:#000}.br{background:var(--demonic);color:#fff}

/* TUTORIAL OVERLAY */
.tut-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.tut-ov.active{display:flex}
.tut-box{background:#13151a;border:1px solid var(--accent);border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center}
.tut-step{font-size:2rem;margin-bottom:12px}
.tut-title{font-size:1.1rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.tut-desc{font-size:.8rem;color:var(--dim);line-height:1.5;margin-bottom:16px}
.tut-progress{font-size:.65rem;color:var(--dim);margin-bottom:12px}

/* ADMIN PANEL */
.ap-section{margin-bottom:16px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.ap-title{font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.ap-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.ap-input{flex:1;padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.8rem;outline:none}
.ap-btn{padding:8px 14px;border-radius:6px;border:none;font-family:inherit;font-weight:700;cursor:pointer;font-size:.75rem}
.ap-code{font-family:monospace;font-size:.9rem;letter-spacing:2px;color:var(--accent);padding:8px;background:rgba(99,102,241,.1);border-radius:6px;word-break:break-all}

.corruption-bar{width:100%;max-width:300px;padding:8px 12px;background:rgba(107,114,128,.1);border:1px solid rgba(107,114,128,.3);border-radius:8px;font-size:.7rem;color:var(--void);text-align:center}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="hamburger" onclick="toggleDrawer()">☰</div>
<a href="./index.html" class="close-sigil">✕</a>
<div class="help-btn" onclick="openTutorial()">?</div>

<div class="dov" id="dov" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dt">☰ Nexus Gate</div>
  <div class="di active" data-view="core"><span class="di-i">☯</span>Core</div>
  <div class="di" data-view="forge"><span class="di-i">⚒️</span>Forge</div>
  <div class="di" data-view="dao"><span class="di-i">🌌</span>Dao Matrix</div>
  <div class="di" data-view="defense"><span class="di-i">🛡️</span>Defense</div>
  <div class="di" data-view="wararts"><span class="di-i">⚔️</span>War Arts</div>
  <div class="di" data-view="dungeon"><span class="di-i">🏰</span>Dungeon</div>
  <div class="di" data-view="mystic"><span class="di-i">🎲</span>Mystic</div>
  <div class="di" data-view="evolution"><span class="di-i">🧬</span>Evolution</div>
  <div class="di" data-view="quests"><span class="di-i">📜</span>Quests</div>
  <div class="di" data-view="shop"><span class="di-i">🏪</span>Shop</div>
  <div class="di" data-view="ascend"><span class="di-i">🔥</span>Ascend</div>
  <div class="di" data-view="admin" id="nav-admin" style="display:none"><span class="di-i">🔧</span>Admin</div>
</div>

<div class="sb">
  <div class="sr"><div class="rn" id="rn">Mortal</div><div class="cr">
    <span class="cb ci" id="bi">✨0</span><span class="cb cs" id="bs">💎0</span>
    <span class="cb cd" id="bse">💀0</span>
    <span class="cb cm" id="bm">💧0</span>
  </div></div>
  <div class="qm" id="qm">0</div>
  <div class="qs"><span id="qd">0 Qi/s</span><span id="qt">1 Qi/tap</span></div>
  <div class="un" id="un-display"></div>
</div>

<div class="mc" id="mc"></div>
<div class="toast" id="toast"></div>

<!-- GENERIC MODAL -->
<div class="mo" id="mo"><div class="mb"><div class="mt" id="mot"></div><div class="md" id="mod"></div><input class="mi" id="moi" style="display:none" placeholder=""><div class="mbs" id="mob"></div></div></div>

<!-- TUTORIAL OVERLAY -->
<div class="tut-ov" id="tut-ov">
  <div class="tut-box">
    <div class="tut-step" id="tut-step">☯</div>
    <div class="tut-title" id="tut-title">Welcome</div>
    <div class="tut-desc" id="tut-desc">Description</div>
    <div class="tut-progress" id="tut-prog">Step 1/6</div>
    <div class="mbs">
      <button class="btn bs" onclick="closeTutorial()">Skip</button>
      <button class="btn bp" onclick="nextTutorial()">Next →</button>
    </div>
  </div>
</div>

<!-- USERNAME MODAL (First Load) -->
<div class="mo active" id="username-modal">
  <div class="mb">
    <div class="mt">🌀 Welcome to Nexus Gate</div>
    <div class="md">Enter your cultivator name to begin your journey.</div>
    <input class="mi" id="username-input" placeholder="Username (3-16 chars)" maxlength="16" style="text-transform:none">
    <div class="mbs"><button class="btn bp" onclick="registerUsername()">Begin Cultivation</button></div>
  </div>
</div>

<script>

{id:"B2",p:"body",n:"Steel Bones",d:"+100% tap",c:2,r:["B1"],e:{tm:1}},
{id:"B3",p:"body",n:"Titan Fist",d:"+200% tap",c:4,r:["B2"],e:{tm:2}},

const cvs=document.getElementById("particles"),ctx=cvs.getContext("2d");
let parts=[];
function resizeCvs(){cvs.width=window.innerWidth;cvs.height=window.innerHeight;}
window.addEventListener("resize",resizeCvs);resizeCvs();
function spawnParts(x,y,color,count){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color,size:2+Math.random()*3});}}
function updateParts(){ctx.clearRect(0,0,cvs.width,cvs.height);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.02;if(p.life<=0){parts.splice(i,1);continue;}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function getPartColor(){const m={"human":"#6366f1","fox":"#f97316","golem":"#78716c","dragon":"#eab308","phoenix":"#ef4444","celestial":"#fbbf24","voidwalker":"#6b7280","nexus":"#ffffff"};return m[S.species]||"#6366f1";}
setInterval(updateParts,16);

let lastAct=Date.now(),isAway=false;const AWAY_MS=120000;
(function(){
const d=document.createElement('div');
d.style.cssText='position:fixed;bottom:max(env(safe-area-inset-bottom),16px);left:16px;z-index:150;display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:20px;font-size:.6rem;color:var(--dim);pointer-events:none';
d.innerHTML='<span id="pw-dot" style="width:8px;height:8px;border-radius:50%;background:#22c55e"></span><span id="pw-txt">Active</span>';
document.body.appendChild(d);
})();
function syncWard(){const dot=document.getElementById('pw-dot'),txt=document.getElementById('pw-txt');if(!dot)return;if(isAway){dot.style.background='#f59e0b';txt.textContent='Away · Safe';}else{dot.style.background='#22c55e';txt.textContent='Active';}}
function markActive(){lastAct=Date.now();if(isAway){isAway=false;syncWard();showToast('👀 Welcome back! You are protected.');}}
function checkPresence(){const away=document.hidden||(Date.now()-lastAct>AWAY_MS);if(away&&!isAway){isAway=true;syncWard();saveGame();}else if(!away&&isAway){isAway=false;syncWard();}}
function isPresent(){return !isAway&&!document.hidden;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)markActive();checkPresence();});
['pointerdown','keydown','touchstart'].forEach(e=>document.addEventListener(e,markActive,{passive:true}));
setInterval(checkPresence,1000);
(function(){
const prev=parseInt(localStorage.getItem('nexus-presence-lastseen')||'0');
const now=Date.now(),gap=now-prev;
localStorage.setItem('nexus-presence-lastseen',now);
setInterval(()=>localStorage.setItem('nexus-presence-lastseen',Date.now()),5000);
if(prev>0&&gap>300000)setTimeout(()=>showToast('🛡️ Welcome back! Your realm was guarded while you were away.'),900);
})();

let buildMode=null,buildId=null;
function selectBuild(type,id){buildMode=type;buildId=id;showToast(`Selected: ${type==="room"?ROOMS.find(r=>r.id===id)?.n:TRAPS.find(t=>t.id===id)?.n}. Tap a grid cell.`);}
function clickCell(x,y){
if(!buildMode)return;
const key=`${x},${y}`;const sz=S.isAdmin?10:S.dSize;
if(x>=sz||y>=sz)return;
if(buildMode==="room"){
const r=ROOMS.find(rm=>rm.id===buildId);if(!r||S.mana<r.c)return;
if(S.dGrid[key]){showToast("❌ Cell occupied");return;}
S.mana-=r.c;S.dGrid[key]={room:buildId,trap:null};
if(r.e?.co)S.corrupt+=r.e.co;
uQP("rooms",1);showToast(`Built: ${r.n}`);saveGame();rDungeon(document.getElementById("mc"));updateUI();
}else if(buildMode==="trap"){
const t=TRAPS.find(tr=>tr.id===buildId);if(!t||S.mana<t.c)return;
const cell=S.dGrid[key];if(!cell){showToast("❌ Place traps inside rooms only");return;}
if(cell.trap){showToast("❌ Already has a trap");return;}
// Count traps in same room type
const sameRoom=Object.values(S.dGrid).filter(c=>c.room===cell.room&&c.trap===buildId).length;
if(sameRoom>=t.mx){showToast(`❌ Max ${t.mx} per room type`);return;}
S.mana-=t.c;cell.trap=buildId;showToast(`Placed: ${t.n}`);saveGame();rDungeon(document.getElementById("mc"));updateUI();
}
buildMode=null;buildId=null;
}
function expandGrid(){
const sz=S.isAdmin?10:S.dSize;const ec=sz<5?500:sz<7?1500:sz<10?5000:15000;
if(S.mana>=ec){S.mana-=ec;if(S.isAdmin){/* admin stays 10, could add 12 logic */}else{S.dSize++;}showToast(`Expanded to ${S.dSize}x${S.dSize}!`);saveGame();rDungeon(document.getElementById("mc"));updateUI();}
}
function getManaRate(){return Object.keys(S.dGrid).length;}

// === GAME LOGIC ===
function tapCoreLogic(cx,cy,target){
let base=getTP(),final=base;
if(hasSk("C1")||hasSk("C2")){if(hasSk("H2"))final=base*(3+Math.random()*2);else if(hasSk("C5"))final=base*(2+Math.random()*3);else if(hasSk("C2"))final=base*(.5+Math.random()*7.5);else final=base*(.1+Math.random()*4.9);}
if(hasSk("D2")&&Math.random()<.05){final*=10;showToast("⚡ Soul Siphoned! 10x!");}
if(S.gtTaps>0){final*=10;S.gtTaps--;}
if(S.buffs.tap_5x&&S.buffs.tap_5x>Date.now())final*=5;
if(S.buffs.surge&&S.buffs.surge>Date.now())final*=1.5;
final*=getComboMult();
S.qi+=final;S.tqi+=final;S.clicks++;S.cts++;S.sClicks++;
S.combo=Math.min(S.combo+1,50);S.comboTimer=Date.now()+2000;
const st=hasSk("SV3")?50:(hasArt("slip_magnet")?80:100);
if(S.cts>=st){S.cts=0;S.js++;S.slipsE++;showToast("🟢 Jade Slip!");uQP("slips",1);}
chkRealm();uQP("clicks",1);uQP("clicks_s",1);uQP("totalQi",final);uQP("qi_s",final);
spawnFloat({clientX:cx,clientY:cy,target},final);
spawnParts(cx,cy,getPartColor(),6+Math.min(Math.floor(final/1000),10));
updateUI();if(curView==="core")rCore(document.getElementById("mc"));
}

function getComboMult(){return 1+S.combo*0.02;}

function gameTick(){
const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;
// Combo decay
if(now>S.comboTimer)S.combo=Math.max(0,S.combo-1);
// QPS
let qps=getQPS();
if(S.buffs.qps_double&&S.buffs.qps_double>now)qps*=2;
if(S.buffs.qps_pill&&S.buffs.qps_pill>now)qps*=2;
if(S.buffs.surge&&S.buffs.surge>now)qps*=1.5;
if(qps>0){const g=qps*dt;S.qi+=g;S.tqi+=g;S.sQi+=g;}
// Mana regen (capped)
S.mana=Math.min(S.manaCap,S.mana+S.manaRegen*dt);
// Cooldowns
Object.keys(S.scd).forEach(k=>{if(S.scd[k]>0)S.scd[k]-=dt;if(S.scd[k]<0)S.scd[k]=0;});
Object.keys(S.csCd).forEach(k=>{if(S.csCd[k]>0)S.csCd[k]-=dt;if(S.csCd[k]<0)S.csCd[k]=0;});
// Invasion
if(S.waveOn){
let dps=getDPS();
if(S.dbWeak>Date.now())dps*=1.5;
if(S.dbPoison>Date.now())dps*=1.3;
S.wHP-=dps*dt;
if(S.wHP<=0){S.wHP=0;S.waveOn=false;S.wave++;const seR=Math.floor(10*Math.pow(1.4,S.wave));const manaR=Math.floor(20*Math.pow(1.2,S.wave));S.se+=seR;S.mana=Math.min(S.manaCap,S.mana+manaR);uQP("waves",1);showToast(`⚔️ Invasion ${S.wave} repelled! +${seR} SE +${manaR} 💧`);}
}
chkRealm();uQP("playtime",dt);updateUI();
if(curView==="defense")rDefense(document.getElementById("mc"));
if(curView==="core")rCore(document.getElementById("mc"));
}

// === CALCULATIONS ===
function getTP(){let b=1;UPGRADES.filter(u=>u.t==="tap").forEach(u=>b+=(S.ups[u.id]||0)*u.v);let m=1,am=S.gm;SKILLS.filter(s=>S.skills.includes(s.id)).forEach(s=>{if(s.e.tm)m+=s.e.tm;if(s.e.am)am+=s.e.am;});const sp=SPECIES.find(s=>s.id===S.species);if(sp?.b.tm)m+=sp.b.tm;if(sp?.b.am)am+=sp.b.am;if(S.arts.includes("body_pill_perm"))m+=.1;if(S.corrupt>=3&&!hasSk("H6"))m*=.8;return Math.max(1,b*m*am);}
function getQPS(){let b=0;UPGRADES.filter(u=>u.t==="auto").forEach(u=>b+=(S.ups[u.id]||0)*u.v);b+=(S.ups.sat_core||0)*getTP();let m=1,am=S.gm;SKILLS.filter(s=>S.skills.includes(s.id)).forEach(s=>{if(s.e.qm)m+=s.e.qm;if(s.e.am)am+=s.e.am;});if(S.eq){const eq=SHOP_ITEMS.find(i=>i.id===S.eq);if(eq?.e?.qm)m+=eq.e.qm;}const sp=SPECIES.find(s=>s.id===S.species);if(sp?.b.qm)m+=sp.b.qm;if(sp?.b.am)am+=sp.b.am;if(S.corrupt>=3&&!hasSk("H6"))m*=.8;if(S.corrupt>=5)return 0;return Math.max(0,b*m*am);}
function getDPS(){let d=0;CREATURES.forEach(c=>{const lv=S.creatures[c.id]||1;d+=c.dps*lv;});let m=1;WAR_ARTS.filter(w=>S.warArts.includes(w.id)).forEach(w=>{if(w.e.dd)m+=w.e.dd;});if(S.buffs.rally&&S.buffs.rally>Date.now())m*=1.5;return d*m;}
function ensureCreatures(){if(!S.creatures)S.creatures={};CREATURES.forEach(c=>{if(!(c.id in S.creatures))S.creatures[c.id]=1;});}
function getCreatureCost(c,lv){return Math.floor(30*c.dps*Math.pow(lv,1.6));}
function levelCreature(id){const c=CREATURES.find(x=>x.id===id);const lv=S.creatures[id]||1;const cost=getCreatureCost(c,lv);if(S.qi>=cost){S.qi-=cost;S.creatures[id]=lv+1;showToast(`⬆️ ${c.n} → Lv.${lv+1}`);saveGame();if(curView==="defense")rDefense(document.getElementById("mc"));updateUI();}}
function castDebuff(id){const db=DEBUFFS.find(x=>x.id===id);if(!S.waveOn){showToast("❌ No invasion active");return;}if(S.mana<db.c){showToast("❌ Not enough mana");return;}if((S.debuffCd[id]||0)>Date.now()){showToast("❌ On cooldown");return;}S.mana-=db.c;S.debuffCd[id]=Date.now()+db.cd*1000;if(id==="db_weak"){S.dbWeak=Date.now()+12000;showToast("💔 Invaders weakened!");}else if(id==="db_poison"){S.dbPoison=Date.now()+8000;showToast("☠️ Poison cloud!");}else if(id==="db_rend"){S.wHP-=getDPS()*3;showToast("⚡ Soul Rend!");}if(curView==="defense")rDefense(document.getElementById("mc"));updateUI();}
function getIM(){let m=1;SKILLS.filter(s=>S.skills.includes(s.id)).forEach(s=>{if(s.e.im)m+=s.e.im;});const sp=SPECIES.find(s=>s.id===S.species);if(sp?.b.im)m+=sp.b.im;if(S.eq){const eq=SHOP_ITEMS.find(i=>i.id===S.eq);if(eq?.e?.im)m+=eq.e.im;}return m;}
function gUC(u){return Math.floor(u.bc*Math.pow(u.cm,S.ups[u.id]||0));}
function hasSk(id){return S.skills.includes(id);}
function hasArt(id){return S.arts.includes(id);}
function hasWA(id){return S.warArts.includes(id);}
function chkReq(s){if(s.r.includes("ANY2")){const p=new Set(SKILLS.filter(sk=>S.skills.includes(sk.id)&&!sk.id.startsWith("H")).map(sk=>sk.p));return p.size>=2;}return s.r.every(r=>S.skills.includes(r));}
function isSkUl(as){if(as.ul==="free")return true;if(as.ul.startsWith("quest:"))return S.qc[as.ul.replace("quest:","")];if(as.ul==="demonic3")return S.skills.filter(s=>s.startsWith("D")).length>=3;if(as.ul==="void2")return S.skills.includes("V2");if(as.ul.startsWith("species:"))return S.usp.includes(as.ul.replace("species:",""));return false;}

// === ACTIONS ===
function buyUpg(id){const u=UPGRADES.find(x=>x.id===id),c=gUC(u);if(S.qi>=c){S.qi-=c;S.ups[u.id]=(S.ups[u.id]||0)+1;uQP("upgrades",1);updateUI();if(curView==="forge")rForge(document.getElementById("mc"));}}
function buySN(id){const s=SKILLS.find(x=>x.id===id);if(S.skills.includes(id)||!chkReq(s))return;const co=hasSk("S3")?Math.max(1,s.c-1):s.c;if(S.ins<co)return;S.ins-=co;S.skills.push(id);if(s.e.co)S.corrupt+=s.e.co;uQP("skills",1);uQP("skills_s",1);if(s.p==="void")uQP("void_sk",1);if(S.corrupt>=5)uQP("corruption",S.corrupt);showToast(`Mastered: ${s.n}`);saveGame();if(curView==="dao")rDao(document.getElementById("mc"));updateUI();}
function useAS(id){const as=ACTIVE_SKILLS.find(s=>s.id===id);if(!isSkUl(as)||(S.scd[id]||0)>0)return;let cd=as.cd;if(hasSk("SV2"))cd/=2;S.scd[id]=cd;if(as.ef==="qps_double")S.buffs.qps_double=Date.now()+as.dur*1000;else if(as.ef==="qi_burst"){S.qi+=getQPS()*60;S.tqi+=getQPS()*60;}else if(as.ef==="tap_5x"){S.qi*=.95;S.buffs.tap_5x=Date.now()+as.dur*1000;}else if(as.ef==="time_fold"){S.qi+=getQPS()*600;S.tqi+=getQPS()*600;}else if(as.ef==="insight_gain")S.ins++;else if(as.ef==="golden_touch")S.gtTaps=10;else if(as.ef==="surge")S.buffs.surge=Date.now()+as.dur*1000;else if(as.ef==="void_step"){S.qi+=100000;S.tqi+=100000;S.corrupt++;}showToast(`⚡ ${as.n}!`);if(curView==="core")rCore(document.getElementById("mc"));updateUI();}

// === WAR ARTS ===
function buyWA(id){const w=WAR_ARTS.find(x=>x.id===id);if(S.warArts.includes(id)||S.se<w.c)return;S.se-=w.c;S.warArts.push(id);showToast(`Learned: ${w.n}`);saveGame();if(curView==="wararts")rWarArts(document.getElementById("mc"));updateUI();}
function useCS(id){const cs=COMBAT_SKILLS.find(x=>x.id===id);if(!cs||(S.csCd[id]||0)>0||S.se<cs.cost)return;S.se-=cs.cost;S.csCd[id]=cs.cd;if(id==="cs_bomb"){S.wHP-=getDPS()*5;showToast("💣 Soul Bomb!");}else if(id==="cs_rally"){S.buffs.rally=Date.now()+cs.dur*1000;showToast("📯 Rally Cry!");}else if(id==="cs_heal"){S.coreHP=Math.min(S.coreMHP,S.coreHP+S.coreMHP*.3);showToast("💚 Core Healed!");}else if(id==="cs_freeze"){showToast("❄️ Time Frozen!");}else if(id==="cs_harvest"){S.buffs.harvest=Date.now()+cs.dur*1000;showToast("💀 Soul Harvest!");}if(curView==="defense")rDefense(document.getElementById("mc"));updateUI();}

// === DEFENSE ===
function startWave(){if(S.waveOn)return;S.wMHP=Math.floor(50*Math.pow(1.5,S.wave));S.wHP=S.wMHP;S.waveOn=true;showToast(`⚔️ Wave ${S.wave+1} started!`);if(curView==="defense")rDefense(document.getElementById("mc"));}
function buyDef(id){const d=DEFENDERS.find(x=>x.id===id),cnt=S.defs[d.id]||0,cost=Math.floor(d.bc*Math.pow(d.cm,cnt));if(S.dp>=cost){S.dp-=cost;S.defs[d.id]=(S.defs[d.id]||0)+1;showToast(`Summoned: ${d.n}`);if(curView==="defense")rDefense(document.getElementById("mc"));updateUI();}}

// === MYSTIC ===
function openJS(){if(S.js<1)return;S.js--;const r=Math.random();let m="";if(r<.7){const q=500+Math.floor(Math.random()*1500);S.qi+=q;S.tqi+=q;m=`+${q} Qi`;}else if(r<.9){const q=5000+Math.floor(Math.random()*10000);S.qi+=q;S.tqi+=q;m=`+${fN(q)} Qi`;}else if(r<.98){S.ins++;m="+1 Insight";}else{S.st++;m="+1 💎";}showToast(`🟢 ${m}`);if(curView==="mystic")rMystic(document.getElementById("mc"));updateUI();}
function mergeJ(){if(S.js<5)return;S.js-=5;S.gv++;S.tmerges++;uQP("merges",1);showToast("🎁 5→1 Voucher!");if(curView==="mystic")rMystic(document.getElementById("mc"));}
function mergeG(){if(S.gv<5)return;S.gv-=5;S.ggv++;showToast("✨ 5→1 Golden!");if(curView==="mystic")rMystic(document.getElementById("mc"));}
function splitG(){if(S.ggv<1)return;S.ggv--;S.gv+=5;showToast("↩️ Split!");if(curView==="mystic")rMystic(document.getElementById("mc"));}
function rollV(){if(S.gv<1)return;S.gv--;S.trolls++;uQP("rolls",1);uQP("rolls_s",1);const lb=hasSk("C3")?.1:0,al=hasArt("lucky_charm")?.05:0,rm=hasSk("H5")?2:(hasSk("C4")?1.5:1);let r=Math.random()-lb-al,m="";if(r<.02*rm){const q=5e6*rm;S.qi+=q;S.tqi+=q;S.ins+=50;uRS();m=`MYTHIC! +${fN(q)} Qi +50 Ins +Skill!`;}else if(r<.08){const q=1e6*rm;S.qi+=q;S.tqi+=q;S.ins+=15;m=`LEGENDARY! +${fN(q)} Qi +15 Ins`;}else if(r<.2){const q=2e5*rm;S.qi+=q;S.tqi+=q;S.ins+=5;m=`EPIC! +${fN(q)} Qi +5 Ins`;}else if(r<.5){const q=5e4*rm;S.qi+=q;S.tqi+=q;m=`RARE! +${fN(q)} Qi`;}else{const q=1e4*rm;S.qi+=q;S.tqi+=q;m=`Common: +${fN(q)} Qi`;}showToast(`🎲 ${m}`);if(curView==="mystic")rMystic(document.getElementById("mc"));updateUI();}
function rollGV(){if(S.ggv<1)return;S.ggv--;S.trolls++;const rm=hasSk("H5")?2:(hasSk("C4")?1.5:1);let r=Math.random(),m="";if(r<.1){const q=5e7*rm;S.qi+=q;S.tqi+=q;S.ins+=200;S.gm+=.2;m=`DIVINE! +${fN(q)} Qi +200 Ins +20% Global!`;}else if(r<.25){const q=1e7*rm;S.qi+=q;S.tqi+=q;S.ins+=75;m=`MYTHIC! +${fN(q)} Qi +75 Ins`;}else if(r<.6){const q=2e6*rm;S.qi+=q;S.tqi+=q;S.ins+=30;m=`LEGENDARY! +${fN(q)} Qi +30 Ins`;}else{const q=5e5*rm;S.qi+=q;S.tqi+=q;S.ins+=10;m=`EPIC! +${fN(q)} Qi +10 Ins`;}showToast(`🌟 ${m}`);if(curView==="mystic")rMystic(document.getElementById("mc"));updateUI();}
function uRS(){const av=SKILLS.filter(s=>!S.skills.includes(s.id)&&!s.id.startsWith("SV")&&chkReq(s));if(av.length){const p=av[Math.floor(Math.random()*av.length)];S.skills.push(p.id);showToast(`🎁 Free: ${p.n}!`);}}

// === EVOLUTION ===
function evoSp(id){const sp=SPECIES.find(s=>s.id===id);if(S.species===id)return;if(S.usp.includes(id)){if(S.qi>=1000){S.qi-=1000;S.species=id;showToast(`Switched: ${sp.n}!`);}}else{if(sp.c.secret&&!S.sovUnlocked)return;if(!chkSpC(sp))return;if(sp.c.qi)S.qi-=sp.c.qi;if(sp.c.ins)S.ins-=sp.c.ins;S.usp.push(id);S.species=id;S.tevos++;uQP("evos",1);uQP("sp_count",S.usp.length);showToast(`🧬 Evolved: ${sp.n}!`);}saveGame();if(curView==="evolution")rEvolution(document.getElementById("mc"));if(curView==="core")rCore(document.getElementById("mc"));updateUI();}
function chkSpC(sp){if(sp.c.secret)return S.sovUnlocked;if(sp.c.re)return S.reincs>=sp.c.re;if(sp.c.qi&&S.qi<sp.c.qi)return false;if(sp.c.ins&&S.ins<sp.c.ins)return false;return true;}
function fSpC(c){let p=[];if(c.qi)p.push(`${fN(c.qi)} Qi`);if(c.ins)p.push(`${c.ins} Ins`);if(c.re)p.push(`${c.re} Reincs`);return p.join(" + ")||"Free";}

// === SHOP ===
function buySI(id){const item=SHOP_ITEMS.find(i=>i.id===id);if(S.st<item.c)return;if(item.t==="eq"&&S.eq===id)return;if(item.t==="art"&&S.arts.includes(id))return;S.st-=item.c;if(item.t==="con"){if(item.ef==="qps_pill")S.buffs.qps_pill=Date.now()+300000;else if(item.ef==="insight_pill")S.ins++;else if(item.ef==="tap_perm")S.arts.push("body_pill_perm");else if(item.ef==="cleanse")S.corrupt=0;else if(item.ef==="rebirth_keep")S.rbKeep=true;showToast(`Used ${item.n}!`);}else if(item.t==="eq"){S.eq=id;if(item.e?.co)S.corrupt+=item.e.co;showToast(`Equipped ${item.n}!`);}else if(item.t==="art"){S.arts.push(id);showToast(`Acquired ${item.n}!`);}saveGame();if(curView==="shop")rShop(document.getElementById("mc"));updateUI();}

// === QUESTS ===
function gQP(q){switch(q.t){case"clicks":return S.clicks;case"totalQi":return S.tqi;case"upgrades":return Object.values(S.ups).reduce((a,b)=>a+b,0);case"realm":return S.currentRealm||0;case"skills":return S.skills.length;case"slips":return S.slipsE;case"rolls":return S.trolls;case"merges":return S.tmerges;case"evos":return S.tevos;case"playtime":return S.playtime;case"reincs":return S.reincs;case"void_sk":return S.skills.filter(s=>s.startsWith("V")).length;case"clicks_s":return S.sClicks;case"qi_s":return S.sQi;case"skills_s":return S.sSkills;case"rolls_s":return S.sRolls;case"sp_count":return S.usp.length;case"corruption":return S.corrupt;case"waves":return S.wave;case"rooms":return Object.keys(S.dGrid).length;default:return 0;}}
function uQP(t,a){QUESTS.filter(q=>q.t===t&&!S.qc[q.id]).forEach(q=>{if(!S.qp[q.id])S.qp[q.id]=0;S.qp[q.id]+=a;});}
function claimQ(id,e){e.stopPropagation();const q=QUESTS.find(x=>x.id===id);if(gQP(q)<q.tg)return;if(S.qc[q.id]&&q.ot)return;if(q.rp&&S.qcd[q.id]&&S.qcd[q.id]>Date.now())return;if(q.rw.st)S.st+=q.rw.st;if(q.rw.sk)S.askills.push(q.rw.sk);if(q.rw.title)S.title=q.rw.title;S.qc[q.id]=true;if(q.rp){S.qcd[q.id]=Date.now()+q.cd*1000;S.qc[q.id]=false;if(q.t==="clicks_s")S.sClicks=0;if(q.t==="qi_s")S.sQi=0;if(q.t==="skills_s")S.sSkills=0;if(q.t==="rolls_s")S.sRolls=0;}showToast(`📜 ${q.n}! +${q.rw.st||0} 💎`);saveGame();if(curView==="quests")rQuests(document.getElementById("mc"));updateUI();}
function fRW(r){let p=[];if(r.st)p.push(`${r.st} 💎`);if(r.sk)p.push("Skill");if(r.title)p.push("Title");return p.join(", ");}

// === REALM & REINC ===
function chkRealm(){let nr=0;for(let i=REALMS.length-1;i>=0;i--){if(S.tqi>=REALMS[i].t){nr=i;break;}}if(nr>(S.currentRealm||0)){S.currentRealm=nr;const r=REALMS[nr];let ig=Math.floor(r.i*getIM());if(hasSk("SV4"))ig+=10;S.ins+=ig;uQP("realm",nr);showToast(`🌟 ${r.n}! +${ig} Insight`);}}
function openReincModal(){showModal("🔥 Reincarnate?",`Sever cultivation. Lose Qi, Upgrades, Skills.<br>Keep Insight & Stones. Gain <strong>+20% Global Mult</strong>.`,[{t:"Remain",c:"bs",a:"closeModal()"},{t:"Reincarnate",c:"bp",a:"doReinc()"}]);}
function doReinc(){S.reincs++;S.gm+=.2;S.qi=0;S.tqi=0;S.ups={};if(S.rbKeep){S.rbKeep=false;}else if(hasArt("soul_lantern")){S.skills=S.skills.sort(()=>.5-Math.random()).slice(0,3);}else{S.skills=[];}S.currentRealm=0;S.corrupt=0;S.species="human";S.cts=0;S.gtTaps=0;S.buffs={};S.eq=null;uQP("reincs",1);closeModal();showToast(`🔥 Reborn! x${S.gm.toFixed(1)}`);saveGame();switchView("core");updateUI();}

function renderTutStep(){const s=TUT_STEPS[tutStep];document.getElementById("tut-step").textContent=s.s;document.getElementById("tut-title").textContent=s.t;document.getElementById("tut-desc").textContent=s.d;document.getElementById("tut-prog").textContent=`Step ${tutStep+1}/${TUT_STEPS.length}`;}

// === UI HELPERS ===
function updateUI(){document.getElementById("rn").textContent=REALMS[S.currentRealm||0].n;document.getElementById("bi").textContent=`✨${S.ins}`;document.getElementById("bs").textContent=`💎${S.st}`;document.getElementById("bse").textContent=`💀${Math.floor(S.se)}`;document.getElementById("bm").textContent=`💧${Math.floor(S.mana)}/${S.manaCap}`;document.getElementById("qm").textContent=fN(S.qi);document.getElementById("qd").textContent=`${fN(getQPS())} Qi/s`;document.getElementById("qt").textContent=`${fN(getTP())} Qi/tap`;document.getElementById("un-display").textContent=`Cultivator: ${S.username} ${S.isAdmin?"👑":""}`;}
function spawnFloat(e,amt){const el=document.createElement("div");el.className="fq";el.textContent=`+${fN(amt)}`;const r=e.target.getBoundingClientRect();el.style.left=`${(e.clientX||r.left+r.width/2)-r.left}px`;el.style.top=`${(e.clientY||r.top+r.height/2)-r.top}px`;e.target.parentElement.appendChild(el);setTimeout(()=>el.remove(),800);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
function showModal(title,desc,btns,showInput=false){document.getElementById("mot").innerHTML=title;document.getElementById("mod").innerHTML=desc;document.getElementById("moi").style.display=showInput?"block":"none";document.getElementById("moi").value="";document.getElementById("mob").innerHTML=btns.map(b=>`<button class="btn ${b.c}" onclick="${b.a}">${b.t}</button>`).join("");document.getElementById("mo").classList.add("active");}
function closeModal(){document.getElementById("mo").classList.remove("active");}
function fN(n){const s=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];if(n<1000)return Math.floor(n).toLocaleString();let t=Math.floor(Math.log10(n)/3);if(t>=s.length)return n.toExponential(2);return(n/Math.pow(10,t*3)).toFixed(1)+s[t];}
function fT(s){if(s<60)return`${Math.floor(s)}s`;if(s<3600)return`${Math.floor(s/60)}m`;return`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;}

// === SAVE/LOAD ===
function saveGame(){try{localStorage.setItem("nexus-dao-matrix-save",JSON.stringify(S));}catch(e){}}
function loadGame(){try{const s=localStorage.getItem("nexus-dao-matrix-save");if(s){const p=JSON.parse(s);S={...S,...p};if(!S.ups)S.ups={};if(!S.skills)S.skills=[];if(!S.usp)S.usp=["human"];if(!S.qp)S.qp={};if(!S.qc)S.qc={};if(!S.qcd)S.qcd={};if(!S.scd)S.scd={};if(!S.buffs)S.buffs={};if(!S.arts)S.arts=[];if(!S.askills)S.askills=[];if(!S.defs)S.defs={};if(!S.warArts)S.warArts=[];if(!S.csCd)S.csCd={};if(!S.dGrid)S.dGrid={};if(!S.dSize)S.dSize=3;}}catch(e){}}

init();
</script>
